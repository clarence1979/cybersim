<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacker Central</title>
<style>
  :root{
    --bg:#080b11;
    --panel:#0f141d;
    --panel-2:#131a25;
    --line:#1c2532;
    --line-bright:#2a3646;
    --text:#cdd7e5;
    --muted:#64748b;
    --dim:#42536a;
    --cyan:#34d3ee;
    --cyan-dim:#177f92;
    --magenta:#fb5b78;
    --green:#34d399;
    --amber:#f5a524;
    --mono:ui-monospace,'SFMono-Regular','Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(52,211,238,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  a{color:var(--cyan);}

  /* ---- Packet ticker (signature element) ---- */
  .ticker{
    border-bottom:1px solid var(--line);
    background:var(--panel);
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    height:15px;
    display:flex;
    align-items:center;
  }
  .ticker::before{
    content:"LIVE";
    position:absolute;left:0;top:0;bottom:0;z-index:2;
    display:flex;align-items:center;
    padding:0 7px;
    font-size:8.5px;letter-spacing:.16em;font-weight:700;
    color:var(--bg);background:var(--magenta);
  }
  .ticker__track{
    display:inline-block;
    padding-left:44px;
    font-size:9.5px;
    color:var(--dim);
    letter-spacing:.02em;
    animation:scroll 42s linear infinite;
  }
  .ticker__track span{color:var(--muted);}
  .ticker__track b{color:var(--cyan-dim);font-weight:600;}
  @keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* ---- Masthead ---- */
  .mast{
    display:flex;align-items:center;gap:12px;
    padding:4px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
  }
  .mast__mark{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand{
    font-size:clamp(13.5px,2.1vw,16px);
    font-weight:800;
    letter-spacing:.06em;
    margin:0;line-height:1.25;
    color:var(--text);
    text-shadow:0 0 18px rgba(52,211,238,.22);
  }
  .brand::before{
    content:"▐ ";color:var(--cyan);text-shadow:0 0 12px var(--cyan);
  }
  .brand em{color:var(--cyan);font-style:normal;}
  .tagline{
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);
  }
  .status{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(52,211,153,.5);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.45);}
    70%{box-shadow:0 0 0 7px rgba(52,211,153,0);}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}
  }

  /* ---- Tabs ---- */
  /* Tab strip stays visible when the header is collapsed, so the
     collapse toggle lives here rather than in the masthead. */
  .tabbar{
    display:flex;align-items:stretch;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .tabs{
    display:flex;gap:0;
    padding:0 10px;
    flex:1;min-width:0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{height:0;}
  .tab{
    appearance:none;background:transparent;border:0;cursor:pointer;
    font-family:var(--mono);color:var(--muted);
    padding:6px 14px 5px;
    display:flex;flex-direction:row;align-items:baseline;gap:9px;
    border-bottom:2px solid transparent;
    white-space:nowrap;
    transition:color .15s ease,border-color .15s ease,background .15s ease;
  }
  .tab:hover{color:var(--text);background:rgba(52,211,238,.04);}
  .tab__name{font-size:12.5px;font-weight:700;letter-spacing:.02em;}
  .tab__tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}

  /* ---- Collapse toggle ---- */
  .chrome-toggle{
    appearance:none;background:transparent;border:0;border-left:1px solid var(--line);
    cursor:pointer;color:var(--muted);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    display:flex;align-items:center;gap:6px;
    padding:0 12px;flex:0 0 auto;
    transition:color .15s ease,background .15s ease;
  }
  .chrome-toggle:hover{color:var(--cyan);background:rgba(52,211,238,.05);}
  .chrome-toggle:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px;}
  .chrome-toggle__chevron{
    font-size:9px;line-height:1;display:inline-block;
    transition:transform .18s ease;
  }
  .chrome-toggle__label{display:inline;}
  /* Collapsed: hide the ticker and masthead, keep the tab strip. */
  body.is-collapsed .ticker,
  body.is-collapsed .mast{display:none;}
  body.is-collapsed .chrome-toggle__chevron{transform:rotate(180deg);}
  @media (max-width:560px){
    .chrome-toggle__label{display:none;}
  }
  .tab[aria-selected="true"]{
    color:var(--text);
    border-bottom-color:var(--cyan);
    background:linear-gradient(180deg,rgba(52,211,238,.08),transparent);
  }
  .tab[aria-selected="true"] .tab__tag{color:var(--cyan);}
  .tab:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px;}

  /* ---- Viewport ---- */
  .stage{position:relative;flex:1;min-height:0;background:var(--bg);}
  .frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    background:#000;display:none;
  }
  .frame.is-active{display:block;}
  .fallback{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  }
  .fallback.is-shown{display:flex;}
  .fallback p{color:var(--muted);max-width:34ch;font-size:13px;line-height:1.6;}
  .fallback a{
    text-decoration:none;border:1px solid var(--cyan-dim);
    padding:9px 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--cyan);border-radius:4px;
  }
  .fallback a:hover{background:rgba(52,211,238,.1);}

  /* ---- Footer ---- */
  .foot{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px 20px;
    border-top:1px solid var(--line);
    background:var(--panel);
    font-size:11.5px;color:var(--muted);
  }
  .foot__addr{color:var(--dim);}
  .foot__addr b{color:var(--cyan-dim);font-weight:600;}
  .foot__spacer{margin-left:auto;}
  .foot__note{color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:10px;}
  .foot a{
    text-decoration:none;color:var(--cyan);
    display:inline-flex;align-items:center;gap:5px;
  }
  .foot a:hover{text-decoration:underline;}

  @media (max-width:560px){
    .mast{flex-wrap:wrap;}
    .status{margin-left:0;}
    .tab{padding:6px 11px 5px;}
  }
  @media (prefers-reduced-motion:reduce){
    .ticker__track{animation:none;padding-left:44px;}
    .dot{animation:none;}
    .chrome-toggle__chevron{transition:none;}
  }
</style>
</head>
<body>

  <!-- Live packet ticker -->
  <div class="ticker" id="chromeTicker" aria-hidden="true">
    <div class="ticker__track" id="ticker"></div>
  </div>

  <!-- Masthead -->
  <header class="mast" id="chromeMast">
    <div class="mast__mark">
      <h1 class="brand">HACKER <em>CENTRAL</em></h1>
      <span class="tagline">Cybersecurity Simulator Hub</span>
    </div>
    <div class="status"><span class="dot"></span>Lab node · isolated</div>
  </header>

  <!-- Tabs + collapse toggle -->
  <div class="tabbar">
    <nav class="tabs" role="tablist" aria-label="Simulators">
      <button class="tab" role="tab" aria-selected="true" id="tab-0" aria-controls="frame-0"
              data-url="https://clarence1979.github.io/ddossim/">
        <span class="tab__name">DDoS Attack Cockpit</span>
        <span class="tab__tag">Attack orchestration</span>
      </button>
      <button class="tab" role="tab" aria-selected="false" id="tab-1" aria-controls="frame-1"
              data-url="https://clarence1979.github.io/cybersim/cyberrange.html">
        <span class="tab__name">Cyber Range</span>
        <span class="tab__tag">Practice environment</span>
      </button>
      <button class="tab" role="tab" aria-selected="false" id="tab-2" aria-controls="frame-2"
              data-url="https://clarence1979.github.io/cybersim/cybersec-simulator.html">
        <span class="tab__name">CyberSec Simulator</span>
        <span class="tab__tag">Pentest training</span>
      </button>
      <button class="tab" role="tab" aria-selected="false" id="tab-3" aria-controls="frame-3"
              data-url="https://clarence1979.github.io/cybersim/kali-lab-sim%20(1).html">
        <span class="tab__name">Kali Emulator</span>
        <span class="tab__tag">Terminal workspace</span>
      </button>
    </nav>
    <button class="chrome-toggle" id="chromeToggle" type="button"
            aria-expanded="true" aria-controls="chromeTicker chromeMast"
            title="Collapse header (H)">
      <span class="chrome-toggle__chevron" aria-hidden="true">▲</span>
      <span class="chrome-toggle__label" id="chromeToggleLabel">Hide</span>
    </button>
  </div>

  <!-- Viewport -->
  <main class="stage">
    <iframe class="frame is-active" id="frame-0" role="tabpanel" aria-labelledby="tab-0"
            title="DDoS Attack Cockpit"
            allow="fullscreen; clipboard-write; downloads"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
    <iframe class="frame" id="frame-1" role="tabpanel" aria-labelledby="tab-1"
            title="Cyber Range"
            allow="fullscreen; clipboard-write; downloads"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
    <iframe class="frame" id="frame-2" role="tabpanel" aria-labelledby="tab-2"
            title="CyberSec Simulator"
            allow="fullscreen; clipboard-write; downloads"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
    <iframe class="frame" id="frame-3" role="tabpanel" aria-labelledby="tab-3"
            title="Kali Emulator"
            allow="fullscreen; clipboard-write; downloads"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>

    <div class="fallback" id="fallback">
      <p>This tool blocks embedding. Open it in its own tab to run it.</p>
      <a id="fallback-link" href="#" target="_blank" rel="noopener">Open tool ↗</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="foot">
    <span class="foot__addr">SRC: <b id="addr">clarence1979.github.io/ddossim/</b></span>
    <span class="foot__spacer"></span>
    <span class="foot__note">Training use only</span>
    <a id="open-ext" href="https://clarence1979.github.io/ddossim/" target="_blank" rel="noopener">Open in new tab ↗</a>
  </footer>

<script>
(function(){
  var tabs   = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var frames = Array.prototype.slice.call(document.querySelectorAll('.frame'));
  var addr   = document.getElementById('addr');
  var openExt= document.getElementById('open-ext');
  var fb     = document.getElementById('fallback');
  var fbLink = document.getElementById('fallback-link');
  var loaded = tabs.map(function(){ return false; });

  function shortUrl(u){ return u.replace(/^https?:\/\//,''); }

  function activate(i, focus){
    tabs.forEach(function(t,n){
      var sel = n === i;
      t.setAttribute('aria-selected', sel ? 'true' : 'false');
      t.tabIndex = sel ? 0 : -1;
      frames[n].classList.toggle('is-active', sel);
    });

    var url = tabs[i].dataset.url;

    // Lazy-load each frame only when first opened.
    if(!loaded[i]){
      frames[i].src = url;
      loaded[i] = true;
    }

    fb.classList.remove('is-shown');
    addr.textContent = shortUrl(url);
    openExt.href = url;
    fbLink.href  = url;

    if(focus) tabs[i].focus();
  }

  tabs.forEach(function(tab, i){
    tab.addEventListener('click', function(){ activate(i, false); });
    tab.addEventListener('keydown', function(e){
      var last = tabs.length - 1, next = null;
      if(e.key === 'ArrowRight' || e.key === 'ArrowDown') next = i === last ? 0 : i + 1;
      else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = i === 0 ? last : i - 1;
      else if(e.key === 'Home') next = 0;
      else if(e.key === 'End') next = last;
      if(next !== null){ e.preventDefault(); activate(next, true); }
    });
  });

  // Init first tab.
  tabs[0].tabIndex = 0;
  activate(0, false);

  // ---- Collapse / expand the header chrome ----
  var toggle = document.getElementById('chromeToggle');
  var toggleLabel = document.getElementById('chromeToggleLabel');
  var collapsed = false;

  function setCollapsed(state){
    collapsed = state;
    document.body.classList.toggle('is-collapsed', collapsed);
    toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    toggle.title = (collapsed ? 'Show header (H)' : 'Collapse header (H)');
    toggleLabel.textContent = collapsed ? 'Show' : 'Hide';
  }

  toggle.addEventListener('click', function(){ setCollapsed(!collapsed); });

  // "H" toggles too, as long as focus isn't inside a text field.
  document.addEventListener('keydown', function(e){
    if(e.key !== 'h' && e.key !== 'H') return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    e.preventDefault();
    setCollapsed(!collapsed);
  });

  // ---- Packet ticker feed ----
  function ip(){ return [10, r(1,254), r(0,254), r(1,254)].join('.'); }
  function r(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  var protos=['TCP','UDP','ICMP','TLS','HTTP','DNS','ARP'];
  var flags=['SYN','ACK','SYN-ACK','RST','FIN','PSH'];
  function line(){
    var p = protos[r(0,protos.length-1)];
    return '<span>'+ip()+':'+r(1024,65535)+' → '+ip()+':'+r(20,443)+'</span> '+
           '<b>'+p+'</b> '+flags[r(0,flags.length-1)]+' '+r(40,1500)+'B  ·  ';
  }
  var feed='';
  for(var k=0;k<40;k++){ feed += line(); }
  // Duplicate the sequence so the -50% scroll loops seamlessly.
  document.getElementById('ticker').innerHTML = feed + feed;
})();
</script>
</body>
</html>
