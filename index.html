<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSim · Console</title>
<style>
  :root{
    --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'SF Mono','JetBrains Mono','Roboto Mono','Fira Mono',Consolas,'Courier New',monospace;
    --bg:#070a10; --panel:#0d1220; --line:#1d2637; --tx:#dbe4f0; --mut:#7a8699; --mut2:#4a5468;
    --green:#3ddc84; --amber:#ffb84d; --red:#ff5c5c; --blue:#4d8dff; --cyan:#43d6d6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;height:100vh}

  header{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 18px;height:52px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:.05em;font-size:15px;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .brand small{color:var(--mut);font-weight:600;letter-spacing:.09em;font-size:10.5px}

  nav.tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
  .tab{appearance:none;border:1px solid transparent;background:transparent;color:var(--mut);
       font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em;text-decoration:none;
       padding:8px 16px;border-radius:9px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:.15s}
  .tab .i{width:7px;height:7px;border-radius:50%;background:var(--mut2)}
  .tab:hover{color:var(--tx);background:rgba(255,255,255,.05)}
  .tab.active{color:var(--tx);background:#101a2e;border-color:var(--line)}
  .tab.active .i{background:var(--blue);box-shadow:0 0 8px var(--blue)}

  a.ext{margin-left:auto;color:var(--mut);font-size:12px;text-decoration:none;border:1px solid var(--line);
        border-radius:8px;padding:7px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  a.ext:hover{color:var(--tx);border-color:var(--blue)}

  main{flex:1;min-height:0;position:relative}
  .frameWrap{position:absolute;inset:0;display:none}
  .frameWrap.active{display:block}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:block;z-index:1}

  /* Placeholder shown only while a frame loads. It must NEVER block clicks. */
  .loading{position:absolute;inset:0;z-index:0;pointer-events:none;
           display:flex;align-items:center;justify-content:center;
           color:var(--mut);font-family:var(--mono);font-size:12px;letter-spacing:.1em}
  .loading.done{display:none}

  @media (max-width:640px){
    header{gap:12px;padding:0 12px;height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:8px}
    .brand{font-size:14px;width:100%}
    a.ext{margin-left:0}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>CYBERSIM <small>CONSOLE</small></div>
  <nav class="tabs" id="tabs">
    <a class="tab active" data-target="frame-range" href="https://hack.teachingtools.dev/cyberrange.html"><span class="i"></span>Cyber Range</a>
    <a class="tab" data-target="frame-sim" href="https://hack.teachingtools.dev/cybersec-simulator.html"><span class="i"></span>Cybersec Simulator</a>
    <a class="tab" data-target="frame-kali" href="https://hack.teachingtools.dev/kali-lab-sim-updated.html"><span class="i"></span>Kali Lab Sim</a>
  </nav>
  <a class="ext" id="openTab" href="https://hack.teachingtools.dev/cyberrange.html" target="_blank" rel="noopener">Open in new tab &#8599;</a>
</header>

<main id="stage">
  <div class="frameWrap active" id="frame-range" data-src="https://hack.teachingtools.dev/cyberrange.html">
    <div class="loading">LOADING CYBER RANGE&#8230;</div>
  </div>
  <div class="frameWrap" id="frame-sim" data-src="https://hack.teachingtools.dev/cybersec-simulator.html">
    <div class="loading">LOADING CYBERSEC SIMULATOR&#8230;</div>
  </div>
  <div class="frameWrap" id="frame-kali" data-src="https://hack.teachingtools.dev/kali-lab-sim-updated.html">
    <div class="loading">LOADING KALI LAB SIM&#8230;</div>
  </div>
</main>

<script>
(function(){
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var openTab = document.getElementById('openTab');

  // Lazily create the iframe for a pane the first time it's shown.
  function ensureFrame(wrap){
    if(wrap.dataset.loaded) return;
    var f = document.createElement('iframe');
    f.setAttribute('title', wrap.id);
    f.addEventListener('load', function(){
      var l = wrap.querySelector('.loading');
      if(l) l.classList.add('done');   // hide placeholder once content is in
    });
    f.src = wrap.dataset.src;
    wrap.appendChild(f);
    wrap.dataset.loaded = '1';
  }

  function activate(btn){
    tabs.forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');

    var targetId = btn.dataset.target;
    document.querySelectorAll('.frameWrap').forEach(function(w){
      w.classList.toggle('active', w.id === targetId);
    });

    var wrap = document.getElementById(targetId);
    ensureFrame(wrap);
    openTab.href = wrap.dataset.src;
  }

  tabs.forEach(function(btn){
    btn.addEventListener('click', function(e){
      // Plain left-click stays in the shell; Ctrl/Cmd/middle-click opens a real browser tab.
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      activate(btn);
    });
  });

  activate(document.querySelector('.tab.active'));
})();
</script>
</body>
</html>
