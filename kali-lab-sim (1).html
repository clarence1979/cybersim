<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kali Lab Simulator — Digital Vector</title>
<link rel="icon" id="favicon" href="">
<link rel="apple-touch-icon" id="favicon2" href="">
<meta name="description" content="Offline single-file Kali Linux teaching simulator. Scripted output only — for authorised, isolated lab learning." />
<style>
/* ==========================================================================
   KALI LAB SIMULATOR  ·  Digital Vector  ·  single-file offline teaching tool
   --------------------------------------------------------------------------
   Everything here is SIMULATED. No real network interface is touched and no
   real host is attacked. Commands map to scripted, educational output and
   drive an on-screen "victim" so students learn the real Kali workflow before
   using genuine tools in an authorised, isolated lab.
   "Martian Toast" build: no CDN, everything inlined, runs from file://.
   ========================================================================== */
:root{
  --kali-blue:#367bf0; --kali-cyan:#26c6da; --kali-cyan-2:#4dd0e1;
  --panel:#1c1f26; --panel-2:#22262f;
  --desk-1:#0b1120; --desk-2:#111a2e;
  --term-bg:#0c0c14; --term-green:#4ade80; --term-red:#f87171; --term-yellow:#fbbf24;
  --term-blue:#60a5fa; --term-gray:#c7ccd6; --term-magenta:#c792ea;
  --line:rgba(120,170,255,.18); --accent:#557bfa;
  --win-head:#161a22; --ok:#37d67a; --warn:#f6a723; --bad:#ef5350;
  --mono:"DejaVu Sans Mono","Cascadia Code","Consolas","Courier New",monospace;
  --ui:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:var(--ui);color:#e6ebf5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3444;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#39465c}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Desktop ---------- */
#desktop{position:fixed;inset:0;overflow:hidden;background:#1f6ac6}
#wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;z-index:0}
.wall-brand{position:absolute;right:18px;bottom:16px;z-index:3;display:block;line-height:0;pointer-events:auto;cursor:pointer;border-radius:10px;overflow:hidden;opacity:.9;transition:opacity .15s,transform .15s;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.wall-brand:hover{opacity:1;transform:translateY(-1px)}
.wall-brand .dv-logo{width:190px;height:auto;display:block}
.dv-boot{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);line-height:0;border-radius:9px;overflow:hidden;opacity:.9;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.dv-boot .dv-logo{width:190px;height:auto;display:block}
.lab-banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:rgba(15,22,38,.82);border:1px solid var(--line);border-radius:20px;padding:5px 15px;font-size:11.5px;color:#9fb0cc;pointer-events:none;backdrop-filter:blur(3px)}
.lab-banner b{color:#7de3ff}

/* ---------- Xfce top panel ---------- */
#panel{position:absolute;left:0;right:0;top:0;height:30px;z-index:900;display:flex;align-items:center;gap:1px;padding:0 3px;
  background:linear-gradient(#2c303a,#23262e);border-bottom:1px solid #0c0e12;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.launcher{height:26px;display:flex;align-items:center;justify-content:center;padding:0 5px;border-radius:4px;background:transparent;border:0;cursor:pointer}
.launcher:hover{background:rgba(120,160,255,.20)}
.launcher .glyph{width:22px;height:22px;flex:none}
.pin-sep{width:1px;height:20px;background:rgba(255,255,255,.10);margin:0 3px}
.pinned{display:flex;align-items:center;gap:0}
.pinbtn{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:transparent;border:0;cursor:pointer}
.pinbtn:hover{background:rgba(255,255,255,.10)}
.pinbtn img,.pinbtn svg{width:18px;height:18px;display:block}
.wspaces{display:flex;align-items:center;gap:2px;margin-left:5px}
.wsp{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:11px;color:#c3ccdd;cursor:pointer;border:1px solid transparent}
.wsp:hover{background:rgba(255,255,255,.08)}
.wsp.on{background:#3b6fd6;color:#fff;border-color:#5a8bf0}
.panel-spacer{flex:1}
#tasks{display:flex;gap:3px;align-items:center;max-width:40vw;overflow:hidden;margin-left:6px}
.task{height:24px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 9px;border-radius:4px;background:rgba(255,255,255,.06);border:1px solid transparent;color:#c3ccdd;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.task:hover{background:rgba(255,255,255,.11)}
.task.active{background:rgba(90,140,230,.24);color:#fff}
.task .tico{width:13px;height:13px;flex:none}
.task .tico img{width:13px;height:13px;display:block}
#cpugraph{width:52px;height:20px;margin:0 4px;opacity:.9}
.systray{display:flex;align-items:center;gap:0}
.systray .sy{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#c8d2e4;cursor:default}
.systray .sy:hover{background:rgba(255,255,255,.10)}
.systray .sy svg{width:15px;height:15px}
.xp-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 7px;border-radius:20px;background:rgba(90,140,230,.16);border:1px solid rgba(120,160,255,.25);color:#bcd4ff;cursor:pointer;margin:0 3px}
.clockbox{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;padding:0 8px;height:26px;border-radius:4px;color:#eef2fb;cursor:default;text-align:center}
.clockbox:hover{background:rgba(255,255,255,.07)}
.clockbox #clock{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.clockbox #clock-date{font-size:9.5px;color:#aab6cc;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.sy.power:hover{background:#7a2130;color:#fff}
#lock{position:fixed;inset:0;z-index:1200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,10,20,.74);backdrop-filter:blur(10px);cursor:pointer}
#lock.on{display:flex}
#lock .lc{font-size:60px;font-weight:800;color:#eef4ff;font-variant-numeric:tabular-nums;text-shadow:0 2px 34px rgba(58,120,220,.5)}
.lock-logo{width:82px;height:82px;margin-bottom:8px;filter:drop-shadow(0 0 34px rgba(40,120,220,.55))}
img.kali-logo{display:block;object-fit:contain}
img.kf-ava{object-fit:cover;background:transparent}
#lock .ld{font-size:15px;color:#9fb0cc}
#lock .lu{margin-top:10px;font-size:12px;color:#7f8ba3;border:1px solid #2a3242;border-radius:20px;padding:8px 18px;background:rgba(20,26,38,.6)}
img.ic{display:inline-block;vertical-align:middle;object-fit:contain}


/* ---------- Desktop icons (KDE-style) ---------- */
#icons{position:absolute;top:40px;left:12px;display:flex;flex-direction:column;gap:2px;z-index:50}
.dicon{width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:8px;cursor:pointer;text-align:center;color:#eef2fb;user-select:none}
.dicon:hover{background:rgba(90,140,230,.22);outline:1px solid rgba(160,200,255,.35)}
.dicon .di{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.dicon .di svg{width:44px;height:44px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.dicon.mission .di{width:48px;height:48px;border-radius:12px;background:linear-gradient(160deg,#2e2714,#241d0e);border:1px solid rgba(255,202,74,.34)}
.dicon.mission .di svg{width:30px;height:30px}
.dicon .dl{font-size:11.5px;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.7);font-weight:500}

/* ---------- Files (Dolphin-style) window ---------- */
.files{display:flex;flex-direction:column;height:100%;background:#0f141d;color:#dbe4f5}
.ftop{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #232a36;font-size:12.5px;background:#141a24}
.ftop .fpath{font-weight:600;color:#eaf1ff;display:flex;align-items:center;gap:7px}
.ftop .fpath svg{width:15px;height:15px}
.fbody{flex:1;display:flex;min-height:0}
.fplaces{width:158px;border-right:1px solid #232a36;padding:8px 6px;overflow:auto;background:#121821}
.fplhead{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7f8ba3;margin:2px 8px 6px}
.fplace{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;font-size:12px;color:#c3ccdd;cursor:pointer}
.fplace:hover{background:#1e2836}.fplace.on{background:#2b64c4;color:#fff}
.fplace svg{width:16px;height:16px;flex:none}
.fmain{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:4px;align-content:start}
.fitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:8px;cursor:pointer;text-align:center}
.fitem:hover{background:#1e2836}
.fitem svg{width:42px;height:42px}
.fitem .fnm{font-size:11px;color:#dbe4f5;line-height:1.2}
.fempty{grid-column:1/-1;padding:44px;text-align:center;color:#6b7790;font-size:13px}

/* ---------- Bluetooth speaker / mission widgets ---------- */
.spk{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:1px solid #33456a;background:#101a2e}
.spk.silent{border-color:#6b2740;background:#241318}
.spk .icon{font-size:24px}
.spk .t{font-size:13px;font-weight:700;color:#cfe0ff}
.spk.silent .t{color:#ffb3c0}
.spk .s{font-size:11px;color:#8fb0ff}
.spk.silent .s{color:#ff9bb0}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.wave i{width:3px;background:#4dd0e1;border-radius:2px;animation:wv .8s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:5px}50%{height:16px}}
.obj-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid #202b42}
.obj-row:last-child{border-bottom:none}
.obj-ck{width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid #35507a;display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;margin-top:1px}
.obj-row.done .obj-ck{background:#37d67a;border-color:#37d67a;color:#052}
.obj-row .ot{font-size:12.5px;color:#dbe4f5;font-weight:600}
.obj-row.done .ot{color:#9fe6b5}
.obj-row .oh{font-size:11px;color:#8a97b5;margin-top:2px;line-height:1.4}

/* ---------- Whisker application menu (Xfce) ---------- */
#appmenu{position:absolute;top:31px;left:2px;width:562px;height:min(660px,90vh);z-index:950;background:linear-gradient(#242830,#1b1e26);border:1px solid #11141a;border-radius:4px;box-shadow:0 24px 70px rgba(0,0,0,.75);display:none;flex-direction:column;overflow:hidden}
#appmenu.on{display:flex}
.kf-top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.kf-ava{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;order:3;background:transparent}
.kf-user{display:none}
#kfSearch{flex:1;order:1;padding:7px 11px;border-radius:4px;border:1px solid #10131a;background:#1a1d24;color:#e6ecf7;font-size:12.5px;outline:none}
#kfSearch:focus{border-color:#3b6fd6}
.kf-body{flex:1;display:flex;min-height:0;border-top:1px solid #14171d}
.kf-side{width:214px;overflow-y:auto;border-right:1px solid #14171d;padding:4px}
.kf-tab{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:4px;font-size:12.5px;color:#cbd4e4;cursor:pointer;white-space:nowrap}
.kf-tab:hover{background:#2f3746}.kf-tab.on{background:#3b6fd6;color:#fff}
.kf-tab .ti{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.kf-tab .ti svg{width:17px;height:17px}.kf-tab .ti img{width:17px;height:17px}
.kf-sep{height:1px;background:#14171d;margin:5px 8px}
.kf-main{flex:1;overflow-y:auto;padding:4px}
.kf-list{display:flex;flex-direction:column;gap:0}
.kf-app{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:4px;cursor:pointer}
.kf-app:hover{background:#2f3746}
.kf-app .aicon{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center}
.kf-app .aicon svg{width:24px;height:24px}.kf-app .aicon img{width:24px;height:24px}
.kf-app .aname{font-size:12.5px;color:#e9eefb;line-height:1.2}
.kf-app .adesc{display:none}
.kf-app.mission .aname{color:#ffdf9e}
.kf-empty{padding:26px;text-align:center;color:#6b7790;font-size:12.5px}
.kf-foot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #14171d}
.kf-foot .fuser{display:flex;align-items:center;gap:9px;font-size:13px;color:#e9eefb;flex:1}
.kf-foot .fuser img{width:26px;height:26px;border-radius:50%}
.kf-fbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;border:0;background:transparent;color:#9fb2d8;cursor:pointer}
.kf-fbtn:hover{background:#2f3746}
.kf-fbtn svg{width:17px;height:17px}
.kf-fbtn.danger:hover{background:#7a2130;color:#fff}

/* ---------- Windows ---------- */
.window{position:absolute;min-width:300px;min-height:180px;z-index:100;display:flex;flex-direction:column;background:var(--panel);border:1px solid #2c3547;border-radius:10px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.window.focused{border-color:#3a6bd0;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(58,107,208,.35)}
.window.min{display:none}
.window.max{border-radius:0}
.wtitle{height:33px;display:flex;align-items:center;gap:8px;padding:0 8px 0 11px;cursor:move;background:linear-gradient(var(--win-head),#12151c);border-bottom:1px solid #2b3446;user-select:none}
.wtitle .t-ico{width:14px;height:14px;flex:none}
.wtitle .t-name{font-size:12.5px;color:#dbe4f5;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtns{display:flex;gap:7px;align-items:center}
.wbtn{width:13px;height:13px;border-radius:50%;border:none;cursor:pointer;padding:0}
.wbtn.mn{background:#f5b73d}
.wbtn.mx{background:#3ecf6a}
.wbtn.cl{background:#f0655b}
.wbtn:hover{filter:brightness(1.15)}
.wbody{flex:1;overflow:auto;background:var(--panel);position:relative}
.wbody.noscroll{overflow:hidden;padding:0}
.osint-frame{width:100%;height:100%;border:0;display:block;background:#0b1220}
.mousepad{width:100%;height:100%;border:0;resize:none;background:#0f141d;color:#dbe4f5;font:13px/1.6 var(--mono,monospace);padding:12px;outline:none}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5}
.rz::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-right:2px solid #4a5670;border-bottom:2px solid #4a5670;border-radius:0 0 3px 0}

/* ---------- Terminal ---------- */
.term{height:100%;display:flex;flex-direction:column;background:var(--term-bg)}
.term-scroll{flex:1;overflow:auto;padding:10px 12px 4px;font:12.6px/1.5 var(--mono);color:var(--term-gray)}
.term-scroll .ln{white-space:pre-wrap;word-break:break-word}
.term-scroll .in{color:var(--kali-cyan-2)}
.term-scroll .g{color:var(--term-green)} .term-scroll .r{color:var(--term-red)}
.term-scroll .y{color:var(--term-yellow)} .term-scroll .b{color:var(--term-blue)}
.term-scroll .m{color:var(--term-magenta)} .term-scroll .dim{color:#6b7488}
.term-scroll .w{color:#fff}
.term-inputrow{display:flex;align-items:baseline;padding:2px 12px 12px;font:12.6px/1.4 var(--mono)}
.term-lead{white-space:pre;color:var(--term-blue)}
.term-input{flex:1;background:transparent;border:none;outline:none;color:#eef2fb;font:12.6px var(--mono);caret-color:var(--kali-cyan);margin-left:4px}

/* ---------- Tool panels ---------- */
.pad{padding:14px}
.tool h3{margin:0 0 3px;font-size:15px;color:#eaf0fb;display:flex;align-items:center;gap:8px}
.tool .sub{color:#93a0ba;font-size:12px;margin-bottom:13px;line-height:1.5}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;color:#a9b4cc;margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;height:34px;padding:0 10px;border-radius:7px;border:1px solid #33405a;background:#12161f;color:#e7edf8;font-size:13px;outline:none}
textarea.inp{height:auto;padding:8px 10px;resize:vertical}
.inp:focus{border-color:#3a6bd0;box-shadow:0 0 0 2px rgba(58,107,208,.25)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{height:34px;padding:0 14px;border-radius:7px;border:1px solid #33405a;background:#212a3a;color:#e7edf8;font-size:13px;cursor:pointer;font-weight:600}
.btn:hover{background:#2a3550}
.btn.pri{background:linear-gradient(#3a6bd0,#2f56aa);border-color:#3a6bd0;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:#7a2b2b;border-color:#a23a3a;color:#ffdede}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.note{font-size:11.5px;color:#8a95ad;line-height:1.5}
.callout{background:#12203a;border:1px solid #274063;border-left:3px solid var(--kali-cyan);border-radius:8px;padding:10px 12px;font-size:12px;color:#bcd0ee;line-height:1.5;margin-top:12px}
.callout b{color:#7de3ff}
.log{font:11.6px/1.55 var(--mono);background:#0c0f16;border:1px solid #26304a;border-radius:8px;padding:9px 11px;color:#c3ccdd;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .g{color:var(--term-green)}.log .y{color:var(--term-yellow)}.log .r{color:var(--term-red)}.log .b{color:var(--term-blue)}.log .c{color:var(--kali-cyan-2)}.log .dim{color:#6b7488}
.aptable{width:100%;border-collapse:collapse;font-size:12px}
.aptable th,.aptable td{text-align:left;padding:7px 8px;border-bottom:1px solid #232c40}
.aptable th{color:#8b97b0;font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.aptable tbody tr{cursor:pointer}
.aptable tbody tr:hover td{background:#1a2230}
.aptable tbody tr.sel td{background:#20365e}
.enc-wep{color:#f6a723}.enc-wpa{color:#7de3ff}.enc-wpa3{color:#37d67a}.enc-open{color:#f87171}
.pill{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;display:inline-block}
.pill.crk{background:#173a24;color:#5ff09a;border:1px solid #256b3f}
.pill.no{background:#3a2020;color:#ff9a9a;border:1px solid #6b3030}
.pill.new{background:#1c2c50;color:#8fb6ff;border:1px solid #3a5aa0}
.count-badge{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;padding:0 6px;border-radius:11px;background:#2a3550;color:#cfe0ff;font-size:11px;font-weight:700;margin-left:6px}
.progress{height:8px;border-radius:6px;background:#1a2130;overflow:hidden;margin:8px 0}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#26c6da,#3a6bd0);transition:width .18s}

/* ---------- Victim view ---------- */
.victim{height:100%;position:relative;background:#0a1230;overflow:hidden}
.v-wall{position:absolute;inset:0;background:radial-gradient(700px 400px at 70% 20%,rgba(80,140,255,.28),transparent 60%),linear-gradient(160deg,#0d1a3d,#0a1026)}
.v-taskbar{position:absolute;left:0;right:0;bottom:0;height:30px;background:rgba(10,16,32,.9);border-top:1px solid rgba(120,160,255,.25);display:flex;align-items:center;gap:10px;padding:0 10px;font-size:11px;color:#cdd8f0;z-index:6}
.v-taskbar .start{width:16px;height:16px;background:#3a6bd0;border-radius:3px}
.v-taskbar .wifi{margin-left:auto;display:flex;align-items:center;gap:7px}
.v-browser{position:absolute;left:7%;top:8%;width:86%;height:70%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);color:#222}
.v-chrome{height:30px;background:#e9edf3;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #d5dae2}
.v-dots{display:flex;gap:5px}.v-dots i{width:9px;height:9px;border-radius:50%;display:block}
.v-url{flex:1;height:19px;background:#fff;border:1px solid #cfd6e0;border-radius:12px;font:11px var(--mono);color:#3a6bd0;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap}
.v-page{padding:16px 18px;height:calc(100% - 30px);overflow:auto}
.v-bank h2{margin:2px 0 2px;color:#0b3d91;font-size:18px}
.v-bank p{color:#555;font-size:12px;margin:0 0 14px}
.v-bank .vf{margin-bottom:9px}
.v-bank label{font-size:11px;color:#444;display:block;margin-bottom:3px}
.v-bank input{width:100%;height:30px;border:1px solid #c7ccd6;border-radius:6px;padding:0 9px;font-size:12px;color:#222}
.v-bank button{margin-top:6px;height:32px;padding:0 16px;border:none;border-radius:6px;background:#0b3d91;color:#fff;font-weight:600;cursor:pointer}
.v-portal{height:100%;background:linear-gradient(160deg,#0b1220,#152444);color:#eaf1ff;display:flex;align-items:center;justify-content:center;padding:16px}
.v-portal .card{width:min(84%,320px);background:rgba(255,255,255,.06);border:1px solid rgba(120,160,255,.3);border-radius:14px;padding:20px;text-align:center}
.v-portal .logo{font-size:26px}
.v-portal h3{margin:8px 0 2px}
.v-portal small{color:#9fb2d8}
.v-portal input{width:100%;height:32px;margin-top:10px;border-radius:7px;border:1px solid rgba(140,170,255,.35);background:rgba(0,0,0,.25);color:#fff;padding:0 10px;font-size:12px}
.v-portal button{width:100%;height:34px;margin-top:12px;border:none;border-radius:7px;background:#3a6bd0;color:#fff;font-weight:700;cursor:pointer}
.v-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:22px;z-index:8}
.v-overlay.hide{display:none}
.v-overlay.drop{background:rgba(6,10,22,.9)}
.v-overlay.pwn{background:rgba(40,6,10,.86)}
.v-overlay h2{margin:0;font-size:19px}
.v-overlay .big{font-size:44px;line-height:1}
.v-overlay .muted{color:#b9c4dc;font-size:12px;max-width:320px;line-height:1.5}
.v-overlay.pwn h2{color:#ff7a7a}
.blink{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:.35}}
.v-picker{position:absolute;top:8px;left:8px;z-index:7;display:flex;gap:6px}
.v-picker select{height:26px;border-radius:6px;border:1px solid #33405a;background:rgba(10,16,30,.85);color:#dbe4f5;font-size:11px;padding:0 6px}

/* ---------- AI assistant ---------- */
.ai{height:100%;display:flex;flex-direction:column;background:#141821}
.ai-prov{padding:11px 12px;border-bottom:1px solid #26304a;background:#171c26}
.provgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.prov{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid #2c3648;border-radius:8px;cursor:pointer;background:#12161f;font-size:12.5px;color:#d6deee}
.prov:hover{border-color:#3a6bd0}
.prov.on{border-color:#3a6bd0;background:#1a2740;box-shadow:0 0 0 1px rgba(58,107,208,.4) inset}
.prov input{accent-color:#3a6bd0}
.prov .tag{margin-left:auto;font-size:9.5px;color:#7f8ba3}
.ai-cfg{display:none;margin-bottom:8px}
.ai-cfg.on{display:block}
.ai-keyrow{display:flex;gap:7px;margin-bottom:7px}
.ai-keyrow .inp{height:31px;font-size:12px}
.remember{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#a9b4cc}
.remember input{accent-color:#3a6bd0}
.ai-log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:88%;padding:8px 11px;border-radius:10px;font-size:12.6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:#2f56aa;color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:#1c2432;border:1px solid #2b3548;color:#dbe3f2;border-bottom-left-radius:3px}
.msg.sys{align-self:center;background:transparent;color:#7f8ba3;font-size:11px;text-align:center;max-width:100%}
.ai-in{display:flex;gap:8px;padding:10px;border-top:1px solid #26304a;background:#171c26}
.ai-in .inp{height:36px}

/* ---------- Settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #232c40;font-size:13px;color:#cdd8ec}
.swatches{display:flex;gap:8px}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:#fff}

/* ---------- Tutorial ---------- */
#tut-overlay{position:fixed;inset:0;z-index:1200;pointer-events:none;display:none}
#tut-overlay.on{display:block}
#tut-ring{position:absolute;border:2px solid var(--kali-cyan);border-radius:10px;box-shadow:0 0 0 4000px rgba(4,8,18,.62),0 0 22px rgba(38,198,218,.6);transition:all .25s ease;pointer-events:none}
#tut-card{position:absolute;width:340px;max-width:90vw;background:#141a26;border:1px solid #33507f;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:16px;pointer-events:auto;z-index:1210}
#tut-card .step{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5fd0e6;margin-bottom:6px}

.tut-typ span{flex:1;overflow:auto;white-space:nowrap}
.tut-typ button{height:24px;padding:0 9px;border-radius:5px;border:1px solid #33405a;background:#212a3a;color:#cdd8f0;font-size:11px;cursor:pointer;flex:none}
.tut-nav{display:flex;align-items:center;gap:8px}
.tut-nav .sp{flex:1;color:#7f8ba3;font-size:11px}
.tut-turn{background:#0e1626;border:1px solid #2a3d63;border-radius:9px;padding:10px;margin-bottom:11px}
.tut-turn-lbl{font-size:11px;font-weight:700;letter-spacing:.02em;color:#7de3ff;margin-bottom:7px}
.tut-turn-hint{font-size:11px;color:#9aa6bf;margin-top:8px;line-height:1.5}
.tut-turn-hint a{color:#7de3ff;cursor:pointer}
.tut-turn.done{border-color:#245b3a;background:#0f2018}

.tut-interp{background:#12200f;border-left:3px solid #37d67a;border-radius:7px;padding:9px 11px;margin-bottom:11px;font-size:12.4px;line-height:1.55;color:#c7e6cf}
.tut-interp b{color:#a9f0c0}
#tut-card{width:360px}
#tutNext:disabled{opacity:.4;cursor:not-allowed}
.tut-wait{color:#f6a723;font-size:11px;font-weight:600}
#tutNext.pulse{animation:tutpulse .6s ease}
@keyframes tutpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* ---------- Boot ---------- */
/* CSS failsafe: even if JavaScript never runs, the boot splash fades on its own
   after ~3s and stops blocking clicks, so the desktop underneath is always visible. */
#boot{position:fixed;inset:0;z-index:2000;background:#05070d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity .5s;animation:bootAutoHide .6s ease 3s forwards}
#boot.gone{opacity:0;pointer-events:none;animation:none}
@keyframes bootAutoHide{to{opacity:0;visibility:hidden;pointer-events:none}}
#boot .logo{width:88px;height:88px;filter:drop-shadow(0 0 24px rgba(53,123,240,.6))}
#boot .bar{width:240px;height:4px;border-radius:4px;background:#141b2c;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#26c6da,#3a6bd0);transition:width .12s}
#boot .lines{font:11.5px/1.5 var(--mono);color:#5f6b82;height:66px;overflow:hidden;width:340px;max-width:88vw}
#boot .lines b{color:#37d67a}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);z-index:1500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#171d29;border:1px solid #33507f;border-radius:9px;padding:9px 15px;font-size:12.5px;color:#dbe4f5;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .25s}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

@media (max-width:820px){
  #icons{display:none}
  #tasks{max-width:50vw}
  .provgrid{grid-template-columns:1fr}
  .window{max-width:96vw}
}
</style>
</head>

<script>
"use strict";
/* ============================ helpers ============================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hex=()=>Array.from({length:6},()=>"0123456789ABCDEF"[rnd(0,15)]).join("").replace(/(..)(?=.)/g,"$1:").slice(0,17);
function toast(msg,ms=2600){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('#toast').appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},ms);
}

/* ============================ persistent state ============================ */
const LS={
  get(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
const State={
  xp: LS.get('kls_xp',0),
  skills: LS.get('kls_skills',{}),   // toolName -> true
  accent: LS.get('kls_accent','#3a6bd0'),
  addSkill(name,xp=15){
    if(!this.skills[name]){this.skills[name]=true;this.xp+=xp;LS.set('kls_skills',this.skills);LS.set('kls_xp',this.xp);
      toast('⭐ Skill unlocked: '+name+'  (+'+xp+' XP)');updateXP();}
  }
};
function updateXP(){const el=$('#xpChip');if(el)el.textContent='⭐ '+State.xp+' XP · '+Object.keys(State.skills).length+' skills';}

/* ============================ window manager ============================ */
let Z=100;
const Windows={};   // id -> {el, taskEl, min, max, prev}
const DESK_TOP=36;  // panel height

function focusWin(id){
  const w=Windows[id]; if(!w) return;
  Z++; w.el.style.zIndex=Z;
  Object.values(Windows).forEach(o=>o.el.classList.remove('focused'));
  w.el.classList.add('focused');
  $$('#tasks .task').forEach(t=>t.classList.toggle('active',t.dataset.win===id));
}
function syncTask(id){
  const w=Windows[id]; if(!w) return;
  let t=w.taskEl;
  if(!t){
    t=document.createElement('button');t.className='task';t.dataset.win=id;
    t.innerHTML=w.iconSVG+'<span>'+esc(w.title)+'</span>';
    t.onclick=()=>{ if(w.el.classList.contains('min')){w.el.classList.remove('min');focusWin(id);} else if(w.el.classList.contains('focused')){minimizeWin(id);} else {focusWin(id);} };
    $('#tasks').appendChild(t);w.taskEl=t;
  }
}
function minimizeWin(id){const w=Windows[id];if(!w)return;w.el.classList.add('min');$$('#tasks .task').forEach(t=>{if(t.dataset.win===id)t.classList.remove('active');});}
function maximizeWin(id){
  const w=Windows[id];if(!w)return;const el=w.el;
  if(el.classList.contains('max')){
    el.classList.remove('max');Object.assign(el.style,w.prev);
  }else{
    w.prev={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
    el.classList.add('max');
    Object.assign(el.style,{left:'0px',top:DESK_TOP+'px',width:'100vw',height:'calc(100vh - '+DESK_TOP+'px)'});
  }
  focusWin(id);
}
function closeWin(id){
  const w=Windows[id];if(!w)return;
  if(w.onClose)try{w.onClose();}catch(e){}
  w.el.remove(); if(w.taskEl)w.taskEl.remove(); delete Windows[id];
}
function openWindow(opt){
  // opt: {id,title,icon(svg string),w,h,x,y,body(html),mount(fn(bodyEl,winEl)),onClose,single}
  if(Windows[opt.id]){const w=Windows[opt.id];w.el.classList.remove('min');focusWin(opt.id);return w.el;}
  const el=document.createElement('div');el.className='window';el.dataset.id=opt.id;
  const W=Math.min(opt.w||560, window.innerWidth-20);
  const H=Math.min(opt.h||420, window.innerHeight-DESK_TOP-20);
  const openCount=Object.keys(Windows).length;
  const x=opt.x!=null?opt.x:Math.min(120+openCount*26, window.innerWidth-W-20);
  const y=opt.y!=null?opt.y:Math.min(DESK_TOP+22+openCount*24, window.innerHeight-H-20);
  Object.assign(el.style,{width:W+'px',height:H+'px',left:Math.max(6,x)+'px',top:Math.max(DESK_TOP+4,y)+'px'});
  el.innerHTML=
    '<div class="wtitle"><span class="t-ico">'+(opt.icon||'')+'</span><span class="t-name">'+esc(opt.title)+'</span>'+
    '<span class="wbtns"><button class="wbtn mn" title="Minimize"></button><button class="wbtn mx" title="Maximize"></button><button class="wbtn cl" title="Close"></button></span></div>'+
    '<div class="wbody"></div><div class="rz"></div>';
  $('#desktop').appendChild(el);
  const body=$('.wbody',el);
  if(opt.body) body.innerHTML=opt.body;
  Windows[opt.id]={el,title:opt.title,iconSVG:opt.icon||'',onClose:opt.onClose};
  syncTask(opt.id);
  // buttons
  $('.wbtn.mn',el).onclick=e=>{e.stopPropagation();minimizeWin(opt.id);};
  $('.wbtn.mx',el).onclick=e=>{e.stopPropagation();maximizeWin(opt.id);};
  $('.wbtn.cl',el).onclick=e=>{e.stopPropagation();closeWin(opt.id);};
  el.addEventListener('mousedown',()=>focusWin(opt.id),true);
  makeDraggable(el,$('.wtitle',el),opt.id);
  makeResizable(el,$('.rz',el),opt.id);
  focusWin(opt.id);
  if(opt.mount)try{opt.mount(body,el);}catch(e){console.error(e);}
  return el;
}
function makeDraggable(el,handle,id){
  let sx,sy,ox,oy,drag=false;
  handle.addEventListener('mousedown',e=>{
    if(e.target.closest('.wbtn'))return;
    if(el.classList.contains('max'))return;
    drag=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;e.preventDefault();
    document.body.style.userSelect='none';
  });
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    let nx=ox+e.clientX-sx, ny=Math.max(DESK_TOP,oy+e.clientY-sy);
    nx=Math.max(-el.offsetWidth+80,Math.min(nx,window.innerWidth-80));
    ny=Math.min(ny,window.innerHeight-30);
    el.style.left=nx+'px';el.style.top=ny+'px';
  });
  window.addEventListener('mouseup',()=>{drag=false;document.body.style.userSelect='';});
  // touch
  handle.addEventListener('touchstart',e=>{const t=e.touches[0];if(e.target.closest('.wbtn')||el.classList.contains('max'))return;drag=true;sx=t.clientX;sy=t.clientY;ox=el.offsetLeft;oy=el.offsetTop;},{passive:true});
  window.addEventListener('touchmove',e=>{if(!drag)return;const t=e.touches[0];let nx=ox+t.clientX-sx,ny=Math.max(DESK_TOP,oy+t.clientY-sy);el.style.left=nx+'px';el.style.top=ny+'px';},{passive:true});
  window.addEventListener('touchend',()=>{drag=false;});
}
function makeResizable(el,handle,id){
  let sx,sy,ow,oh,rz=false;
  handle.addEventListener('mousedown',e=>{rz=true;sx=e.clientX;sy=e.clientY;ow=el.offsetWidth;oh=el.offsetHeight;e.preventDefault();e.stopPropagation();document.body.style.userSelect='none';});
  window.addEventListener('mousemove',e=>{if(!rz)return;el.style.width=Math.max(300,ow+e.clientX-sx)+'px';el.style.height=Math.max(180,oh+e.clientY-sy)+'px';});
  window.addEventListener('mouseup',()=>{rz=false;document.body.style.userSelect='';});
}

/* ============================ simulated environment ============================

function promptLead(){
  if(Term.mode==='msf') return '<span class="r">msf6</span> <span class="b">&gt;</span>&nbsp;';
  if(Term.mode==='meterpreter') return '<span class="m">meterpreter</span> <span class="b">&gt;</span>&nbsp;';
  return '<span class="b">└─$</span>&nbsp;';
}
const Term={
  scroll:null, input:null, lead:null, busy:false, mode:'sh',
  history:[], hi:-1, msf:{module:null,rhost:'',lhost:ENV.self,payload:''},
  open(){
    openWindow({id:'terminal',title:'kali@kali: ~',icon:ICON.term,w:640,h:420,x:150,y:80,
      body:'<div class="term"><div class="term-scroll" id="termScroll"></div>'+
           '<div class="term-inputrow"><span class="term-lead" id="termLead"></span>'+
           '<input class="term-input" id="termInput" spellcheck="false" autocomplete="off" autocapitalize="off"></div></div>',
      mount:(b)=>{
        this.scroll=$('#termScroll',b); this.input=$('#termInput',b); this.lead=$('#termLead',b);
        if(this.scroll.dataset.init!=='1'){
          this.print('Kali GNU/Linux Rolling — Lab Simulator (scripted output only)','dim');
          this.print('Type <span class="g">help</span> for commands, or run the guided tutorial from Applications.','dim');
          this.print('','');
          this.scroll.dataset.init='1';
        }
        this.bind(); this.showPrompt(); setTimeout(()=>this.input.focus(),30);
      }});
    setTimeout(()=>{if(this.input)this.input.focus();},50);
  },
  bind(){
    const inp=this.input;
    inp.onkeydown=(e)=>{
      if(this.busy){e.preventDefault();return;}
      if(e.key==='Enter'){ e.preventDefault(); const v=inp.value; inp.value=''; this.submit(v); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); if(this.history.length){ this.hi=Math.max(0,this.hi<0?this.history.length-1:this.hi-1); inp.value=this.history[this.hi]||''; setCaretEnd(inp);} }
      else if(e.key==='ArrowDown'){ e.preventDefault(); if(this.hi>=0){ this.hi++; if(this.hi>=this.history.length){this.hi=-1;inp.value='';} else inp.value=this.history[this.hi]; setCaretEnd(inp);} }
      else if(e.key==='l'&&e.ctrlKey){ e.preventDefault(); this.scroll.innerHTML=''; }
      else if(e.key==='c'&&e.ctrlKey){ e.preventDefault(); this.echo(inp.value); this.print('^C','dim'); inp.value=''; if(this.mode!=='sh'){this.mode='sh';this.lead.innerHTML=promptLead();} this.showPrompt(); }
    };
    this.scroll.parentElement.addEventListener('mousedown',e=>{ if(!e.target.closest('input'))setTimeout(()=>inp.focus(),0); });
  },
  print(html,cls){ const d=document.createElement('div'); d.className='ln'+(cls?(' '+cls):''); d.innerHTML=html; this.scroll.appendChild(d); this.scroll.scrollTop=this.scroll.scrollHeight; return d; },
  async typeLines(arr,delay=90){ for(const l of arr){ this.print(l.t||l, l.c||''); if(delay)await sleep(delay);} },
  echo(v){ this.print(promptLead()+'<span class="in">'+esc(v)+'</span>'); },
  showPrompt(){
    if(this.mode==='sh'){ this.print(KALI_TOP(ENV.cwd)); }
    this.lead.innerHTML=promptLead();
    this.scroll.scrollTop=this.scroll.scrollHeight;
    if(this.input)this.input.focus();
  },
  async submit(raw){
    const cmd=raw.trim();
    this.echo(raw);
    if(cmd){ this.history.push(cmd); if(this.history.length>200)this.history.shift(); }
    this.hi=-1;
    this.busy=true; this.lead.style.opacity=.5;
    try{ await this.runLine(cmd); }catch(e){ this.print('sh: internal error: '+esc(e.message),'r'); }
    this.busy=false; this.lead.style.opacity=1;
    this.showPrompt();
    try{ if(typeof Tutorial!=='undefined' && Tutorial.active) Tutorial.onCommand(cmd); }catch(e){}
  },
  async runLine(cmd){
    if(cmd==='') return;
    if(this.mode==='msf'){ return MSF.run(cmd); }
    if(this.mode==='meterpreter'){ return MET.run(cmd); }
    // strip leading sudo
    let line=cmd.replace(/^sudo\s+/,'');
    const parts=line.match(/(?:[^\s"]+|"[^"]*")+/g)||[];
    const name=parts[0];
    const args=parts.slice(1).map(a=>a.replace(/^"|"$/g,''));
    const fn=(typeof CMD!=='undefined')&&CMD[name];
    if(fn){ return fn(args, line); }
    this.print(esc(name)+': command not found','r');
    this.print('Try <span class="g">help</span> to see the tools available in this simulator.','dim');
  }
};
function setCaretEnd(inp){ try{ const v=inp.value; inp.value=''; inp.value=v; }catch(e){} }
function nowClock(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function applyLogos(){ try{
  document.querySelectorAll('img.kali-logo').forEach(function(im){ im.src=KALI_LOGO; });

  var f1=document.getElementById('favicon'), f2=document.getElementById('favicon2');
  if(f1)f1.href=KALI_LOGO; if(f2)f2.href=KALI_LOGO;

/* ============================ shell commands ============================ */
const T=(h,c)=>Term.print(h,c);
const CMD={
  help(){
    T('<span class="g">Kali Lab Simulator — available commands (all output is scripted)</span>');
    const rows=[
      ['System','ls · cd · pwd · cat · whoami · id · uname -a · hostname · history · clear · date'],
      ['Network','ifconfig · ip a · iwconfig · ping &lt;host&gt;'],
      ['Recon','nmap [-sV -O -A -sC -p] &lt;target&gt; · netdiscover · arp-scan · whatweb'],
      ['Web','nikto -h &lt;url&gt; · gobuster · sqlmap -u &lt;url&gt; · wpscan · curl &lt;url&gt;'],
      ['Exploit','searchsploit &lt;term&gt; · msfconsole'],
      ['Passwords','john &lt;file&gt; · hashcat -m 0 &lt;hash&gt; · hydra · crunch'],
      ['Wireless','airmon-ng · airodump-ng · aireplay-ng · aircrack-ng · wifite · wash · reaver'],
      ['Bluetooth','bluetoothctl scan on · l2ping -f &lt;mac&gt; · hcitool scan · rfkill list'],
      ['GUI tools','wireshark · fern-wifi-cracker · wifipumpkin3 · Bluetooth Manager'],
    ];
    rows.forEach(r=>T('  <span class="b">'+r[0].padEnd(10)+'</span> <span class="dim">'+r[1]+'</span>'));
    T('');T('<span class="dim">Tip: run the guided tutorial (Applications → Start guided tutorial) to learn the full workflow.</span>');
  },
  clear(){ Term.scroll.innerHTML=''; },
  pwd(){ T('/home/kali'+(ENV.cwd==='~'?'':'/'+ENV.cwd)); },
  whoami(){ T('kali'); },
  id(){ T('uid=1000(kali) gid=1000(kali) groups=1000(kali),27(sudo)'); },
  hostname(){ T('kali'); },
  date(){ T(new Date().toString()); },
  history(){ Term.history.forEach((h,i)=>T('  '+String(i+1).padStart(4)+'  '+esc(h))); },
  uname(a){ T(a.join(' ').includes('a')?'Linux kali 6.11.2-amd64 #1 SMP PREEMPT_DYNAMIC Kali 6.11.2-1kali1 x86_64 GNU/Linux':'Linux'); },
  echo(a){ T(esc(a.join(' '))); },
  man(a){ T('What manual page do you want? (this simulator ships scripted output — try the command directly, e.g. '+esc(a[0]||'nmap')+' --help)','dim'); },
  ls(a){
    const home=['<span class="b">Desktop</span>','<span class="b">Documents</span>','<span class="b">Downloads</span>','handshake.cap','hashes.txt','loot.txt','notes.md','<span class="g">scan.sh</span>'];
    T(home.join('   '));
  },
  cd(a){ const t=a[0]||'~'; ENV.cwd=(t==='~'||t==='/'||t==='..')?'~':t.replace(/[^\w.-]/g,''); },
  cat(a){
    const f=a[0]||'';
    if(f==='hashes.txt'){T('admin:5f4dcc3b5aa765d61d8327deb882cf99');T('jsmith:e10adc3949ba59abbe56e057f20f883e');T('root:$6$xyz$Q9...(sha512crypt)');}
    else if(f==='notes.md'){T('# Engagement notes');T('- authorised lab only (10.10.14.0/24)');T('- target client: 10.10.14.42');T('- wifi target: HomeNet_5G');}
    else if(f==='/etc/passwd'){T('root:x:0:0:root:/root:/bin/bash');T('kali:x:1000:1000:kali:/home/kali:/bin/bash');T('www-data:x:33:33:...:/usr/sbin/nologin');}
    else T('cat: '+esc(f)+': No such file or directory','r');
  },
  ifconfig(){
    T('<span class="g">eth0</span>: flags=4163&lt;UP,BROADCAST,RUNNING,MULTICAST&gt;  mtu 1500');
    T('        inet 10.10.14.5  netmask 255.255.255.0  broadcast 10.10.14.255');
    T('        ether 00:0c:29:3a:1b:7f  txqueuelen 1000  (Ethernet)');
    T('<span class="g">'+ENV.iface+(ENV.monitor?'mon':'')+'</span>: flags=4163&lt;UP,BROADCAST,RUNNING,MULTICAST&gt;  mtu 1500');
    T('        '+(ENV.monitor?'unassociated  Mode:Monitor':'inet 10.10.14.5  Mode:Managed'));
    T('        ether 00:c0:ca:97:2b:44  txqueuelen 1000  (Ethernet)');
    T('<span class="g">lo</span>: flags=73&lt;UP,LOOPBACK,RUNNING&gt;  mtu 65536');
    T('        inet 127.0.0.1  netmask 255.0.0.0');
  },
  ip(a){ if(a[0]==='a'||a[0]==='addr') return CMD.ifconfig(); T('Usage: ip a','dim'); },
  iwconfig(){
    T(ENV.iface+(ENV.monitor?'mon':'')+'  IEEE 802.11  Mode:'+(ENV.monitor?'Monitor':'Managed')+'  Frequency:2.457 GHz  Tx-Power=20 dBm');
    T('          Retry short limit:7   RTS thr:off   Fragment thr:off');
    T('lo        no wireless extensions.');
    T('eth0      no wireless extensions.');
  },
  async ping(a){
    const host=a.find(x=>!x.startsWith('-'))||'10.10.14.1';
    const up=ENV.hosts.some(h=>h.ip===host)||['8.8.8.8','10.10.14.1'].includes(host);
    T('PING '+esc(host)+' ('+esc(host)+') 56(84) bytes of data.');
    for(let i=1;i<=4;i++){ await sleep(360);
      if(up)T('64 bytes from '+esc(host)+': icmp_seq='+i+' ttl=64 time='+(rnd(8,40)+Math.random()).toFixed(1)+' ms');
      else T('Request timeout for icmp_seq '+i,'dim');
    }
    T('--- '+esc(host)+' ping statistics ---');
    T('4 packets transmitted, '+(up?4:0)+' received, '+(up?0:100)+'% packet loss');
  },
  async nmap(a){

/* ============================ Wireshark ============================ */
const Wireshark={
  body:null, running:false, timer:null, rows:[],
  open(){ openWindow({id:'wireshark',title:'The Wireshark Network Analyzer',icon:ICON.wireshark,w:640,h:440,x:180,y:90,
    mount:(b)=>{this.body=b;this.render();}, onClose:()=>{this.stop();this.body=null;}}); },
  render(){
    const b=this.body;
    b.innerHTML=`<div class="pad tool" style="padding:0;display:flex;flex-direction:column;height:100%">
      <div style="display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #26304a;background:#171c26">
        <button class="btn pri sm" id="ws-go">▶ Start</button>
        <input class="inp" id="ws-filter" placeholder="Apply a display filter …  e.g. eapol || http" style="height:30px;flex:1">
        <span class="chip" style="background:#1a2130">${ENV.iface}${ENV.monitor?'mon':''}</span>
      </div>
      <div style="flex:1;overflow:auto"><table class="aptable" id="ws-tbl"><thead><tr><th>No.</th><th>Time</th><th>Source</th><th>Destination</th><th>Proto</th><th>Info</th></tr></thead><tbody></tbody></table></div>
      <div id="ws-detail" style="height:120px;overflow:auto;border-top:1px solid #26304a;background:#0c0f16;padding:10px;font:11px var(--mono);color:#8fb0d8">Click a packet to inspect it.</div>
    </div>`;
    $('#ws-go',b).onclick=()=>this.toggle();
    $('#ws-filter',b).oninput=e=>this.applyFilter(e.target.value);
  },
  toggle(){ if(this.running)return this.stop(); this.running=true; $('#ws-go',this.body).textContent='■ Stop'; State.addSkill('wireshark capture'); this.tick(); this.timer=setInterval(()=>this.tick(),900); },
  stop(){ this.running=false; if(this.timer){clearInterval(this.timer);this.timer=null;} const g=this.body&&$('#ws-go',this.body); if(g)g.textContent='▶ Start'; },
  tick(){
    const t=(this.rows.length?this.rows[this.rows.length-1].t:0)+ (Math.random()*0.4);
    let pk;
    const roll=Math.random();
    if(ENV.handshake && roll<0.25){ pk={t,src:'DE:AD:BE:EF:42:42',dst:'AA:BB:CC:11:22:33',proto:'EAPOL',info:'Key (Message '+rnd(1,4)+' of 4)',cls:'g'}; }
    else if(roll<0.45){ pk={t,src:'10.10.14.42',dst:'securebank.example',proto:'HTTP',info:'POST /login  (user=j.doe&pass=hunter2)',cls:'y'}; }
    else if(roll<0.7){ pk={t,src:'10.10.14.'+rnd(20,42),dst:'10.10.14.'+rnd(1,254),proto:'TCP',info:rnd(1024,65535)+' → 443 [ACK] Seq='+rnd(1,9999)}; }
    else { pk={t,src:'10.10.14.42',dst:'255.255.255.255',proto:'ARP',info:'Who has 10.10.14.1? Tell 10.10.14.42'}; }
    this.rows.push(pk); if(this.rows.length>200)this.rows.shift();
    this.append(pk);
  },
  append(pk){
    const body=this.body&&$('#ws-tbl tbody',this.body); if(!body)return;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${this.rows.length}</td><td>${pk.t.toFixed(3)}</td><td>${esc(pk.src)}</td><td>${esc(pk.dst)}</td><td class="${pk.cls||''}">${pk.proto}</td><td class="${pk.cls||''}">${esc(pk.info)}</td>`;
    tr.onclick=()=>{ $$('#ws-tbl tbody tr',this.body).forEach(x=>x.classList.remove('sel')); tr.classList.add('sel'); this.detail(pk); };
    body.appendChild(tr);
    const sc=body.closest('[style*="overflow"]'); if(sc)sc.scrollTop=sc.scrollHeight;
  },
  detail(pk){
    const d=$('#ws-detail',this.body); if(!d)return;
    let x=`Frame ${this.rows.indexOf(pk)+1}: on ${ENV.iface}${ENV.monitor?'mon':''}\n`;
    if(pk.proto==='EAPOL') x+='▸ IEEE 802.11 · ▸ 802.1X Authentication\n    Type: EAPOL Key\n    '+pk.info+'\n    → part of the WPA 4-way handshake (feed the .cap to aircrack-ng)';
    else if(pk.proto==='HTTP') x+='▸ HTTP\n    Request Method: POST\n    Form item: "user" = "j.doe"\n    Form item: "pass" = "hunter2"\n    ⚠ credentials sent in clear text (no TLS on this request)';
    else x+='▸ '+pk.proto+'\n    '+pk.info;
    d.textContent=x;
  },
  applyFilter(f){ const rows=$$('#ws-tbl tbody tr',this.body); rows.forEach((tr,i)=>{ const p=this.rows[i]; const show=!f|| (p&&(p.proto.toLowerCase().includes(f.toLowerCase())||f.split('||').some(x=>p.proto.toLowerCase().includes(x.trim().toLowerCase())))); tr.style.display=show?'':'none'; }); }
};

function offlineMentor(q){
  const s=q.toLowerCase();
  if(/handshake|deauth|aireplay/.test(s)) return "Capture a WPA handshake in two steps:\n1) put the card in monitor mode:  airmon-ng start wlan0\n2) deauth a connected client so it reconnects:  aireplay-ng --deauth 10 -a AA:BB:CC:11:22:33 -c DE:AD:BE:EF:42:42 wlan0mon\nWatch the Victim Screen drop and reconnect — that reconnection is when the 4-way handshake is captured. Then crack it with aircrack-ng.";
  if(/aircrack|crack.*wpa|wordlist|rockyou/.test(s)) return "Once you have a handshake .cap, run:\naircrack-ng -w /usr/share/wordlists/rockyou.txt HomeNet-01.cap\nIt tries each word in the list against the handshake. It only ever finds passwords that are in the wordlist — strong, random passphrases resist this, which is exactly the defensive lesson.";
  if(/nmap|scan|recon|ports?/.test(s)) return "Start with recon. Discover hosts:  nmap 10.10.14.0/24\nThen fingerprint one target:  nmap -sV -O 10.10.14.42\n-sV grabs service versions, -O guesses the OS, -A does both plus scripts. Old versions (like Apache 2.4.49) are your way in.";
  if(/pumpkin|evil twin|captive|portal/.test(s)) return "wifipumpkin3 runs an 'evil twin': a rogue AP with a familiar name plus a captive portal. Set the SSID, choose the captiveflask proxy, press Start, and the Victim Screen is redirected to a fake login where anything typed is harvested. Defence: never type a password into an HTTP captive portal, and verify the exact network name.";
  if(/fern/.test(s)) return "Fern is a GUI over the aircrack-ng suite. Enable Monitor Mode → Scan for Access Points → pick a WEP or WPA target → (for WPA) choose a wordlist → Wi-Fi Attack. It deauths a client, grabs the handshake, and dictionary-cracks it, saving the key to its database.";
  if(/metasploit|msf|meterpreter|exploit|eternalblue|ms17/.test(s)) return "In msfconsole:\nsearch ms17_010\nuse exploit/windows/smb/ms17_010_eternalblue\nset RHOSTS 10.10.14.42\nexploit\nA vulnerable host gives you a Meterpreter session — try sysinfo, getuid, screenshot, hashdump. This only works because CLIENT-42 is (deliberately) unpatched.";
  if(/wep/.test(s)) return "WEP is broken: its weak IVs leak key material, so tools recover the key by collecting enough packets (ARP-replay speeds this up). In this lab, pick a WEP network in Fern and the attack runs automatically. Real-world takeaway: never use WEP — use WPA2/WPA3.";
  if(/wireshark|packet|sniff/.test(s)) return "Wireshark shows live frames. Filter with 'eapol' to see the WPA handshake, or 'http' to spot credentials sent without TLS. It's how you prove a capture worked and how defenders spot cleartext leaks.";
  if(/ethic|legal|allowed|permission/.test(s)) return "The golden rule: only test systems you own or have explicit written authorisation to test, on an isolated lab network. Everything in this app is simulated so you can learn the workflow safely before touching real, authorised targets.";

      { phase:'Level up', title:'The rest of your toolkit', open:()=>Fern.open(), target:()=>Windows.fern&&Windows.fern.el,

  start(){ this.build(); this.active=true; this.i=0; this.done={}; this.awaiting=null; $('#tut-overlay').classList.add('on'); this.go(0); },

    if(s.open){ try{s.open();}catch(e){} }
    $('#tutStep').textContent='Lesson '+(this.i+1)+' of '+this.steps.length+(s.phase?' · '+s.phase:'');
    $('#tutTitle').textContent=s.title;
    $('#tutBody').innerHTML=s.body;
    const turn=$('#tutTurn'), interp=$('#tutInterp'), next=$('#tutNext'), sp=$('.tut-nav .sp');
    const isPractice=!!(s.cmd&&s.match);
    if(isPractice){
      if(!Windows.terminal)Term.open();
      turn.style.display='block'; $('#tutCmd').textContent=s.cmd;
      setTimeout(()=>{ if(Windows.terminal&&Term.input){ Term.input.value=s.cmd; Term.input.focus(); } },220);
      if(this.done[this.i]){
        turn.classList.add('done'); const l=$('.tut-turn-lbl',turn); if(l)l.textContent='✓ You ran it';
        interp.style.display='block'; interp.innerHTML=s.interp||''; this.awaiting=null;
        next.disabled=false; sp.textContent='';
      } else {
        turn.classList.remove('done'); const l=$('.tut-turn-lbl',turn); if(l)l.textContent='▶ Your turn — run this in the terminal';
        interp.style.display='none'; this.awaiting=s.match;
        next.disabled=true; sp.innerHTML='<span class="tut-wait">↑ run the command to continue</span>';
      }
    } else {
      turn.style.display='none'; interp.style.display='none'; this.awaiting=null; next.disabled=false; sp.textContent='';
    }
    $('#tutBack').disabled=this.i===0;
    next.textContent=last?'Finish':'Next';
    setTimeout(()=>this.position(s),240);
  },
  onCommand(cmd){
    if(!this.active||!this.awaiting)return;
    if(this.awaiting.test(cmd)){
      this.done[this.i]=true; this.awaiting=null;
      const s=this.steps[this.i], turn=$('#tutTurn'), interp=$('#tutInterp'), next=$('#tutNext'), sp=$('.tut-nav .sp');
      if(turn){ turn.classList.add('done'); const l=$('.tut-turn-lbl',turn); if(l)l.textContent='✓ You ran it'; }
      if(interp){ interp.style.display='block'; interp.innerHTML=s.interp||''; }
      if(next){ next.disabled=false; next.classList.add('pulse'); setTimeout(()=>next.classList.remove('pulse'),1600); }
      if(sp)sp.textContent='';
      toast('✓ Nice — you ran that one yourself');
      setTimeout(()=>this.position(this.steps[this.i]),60);
    }
  },
  runFor(){
    const s=this.steps[this.i]; if(!s||!s.cmd)return;
    if(!Windows.terminal)Term.open();
    setTimeout(()=>{ if(Term.input)Term.input.value=s.cmd; Term.submit(s.cmd); },140);
  },
  position(s){
    const ring=$('#tut-ring'), card=$('#tut-card');
    let el=null; if(s.target){ try{el=s.target();}catch(e){} }
    if(s.center){
      ring.style.display='none';
      card.style.left=Math.max(12,(window.innerWidth-card.offsetWidth)/2)+'px';
      card.style.top=Math.max(56,(window.innerHeight-card.offsetHeight)/2)+'px';
      return;
    }
    // dock the instructor card to the right so the terminal/victim stays visible
    card.style.left=Math.max(12,window.innerWidth-card.offsetWidth-22)+'px';
    card.style.top='72px';
    if(el){ ring.style.display='block'; const r=el.getBoundingClientRect(), pad=6;

    } else ring.style.display='none';
  },
  end(){ this.active=false; this.awaiting=null; $('#tut-overlay').classList.remove('on'); toast('Lesson ended — explore freely, or reopen it any time from Applications.'); }
};

let RECENT=[];
function labelFor(id){ const all=[].concat(KFFAV,DESKICONS.map(d=>[d[0],d[1]]),Object.keys(KFAPPS).reduce((a,k)=>a.concat(KFAPPS[k]),[])); const f=all.find(a=>a[0]===id); return f?f[1]:String(id).replace(/^_+/,''); }
const WEBAPPS={'kali-linux':'https://www.kali.org','kali-tools':'https://www.kali.org/tools/','kali-docs':'https://www.kali.org/docs/','kali-bugs':'https://bugs.kali.org','offsec':'https://www.offsec.com','exploit-db':'https://www.exploit-db.com','vulnhub':'https://www.vulnhub.com'};
const TextEd={ open(){ if(Windows['texteditor']){ Windows['texteditor'].el.classList.remove('min'); focusWin('texteditor'); return; } openWindow({id:'texteditor',title:'Text Editor — mousepad',icon:img('text-editor'),w:560,h:420,x:210,y:70, mount:(b)=>{ b.innerHTML='<textarea class="mousepad" spellcheck="false" placeholder="Untitled — start typing…"></textarea>'; }}); } };
const Kickoff={ tab:'fav', q:'',
  allApps(){ const seen={},out=[]; [KFFAV].concat(Object.keys(KFAPPS).map(k=>KFAPPS[k])).forEach(list=>list.forEach(a=>{ if(!seen[a[0]]){seen[a[0]]=1;out.push(a);} })); return out; },
  build(){ const m=$('#appmenu'); if(!m)return;
    m.innerHTML='<div class="kf-top"><input id="kfSearch" placeholder="Search…" autocomplete="off" spellcheck="false"></div>'
      +'<div class="kf-body"><div class="kf-side" id="kfSide"></div><div class="kf-main"><div class="kf-list" id="kfList"></div></div></div>'

      +'<button class="kf-fbtn" id="fSettings" title="Settings"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>'
      +'<button class="kf-fbtn" id="fLock" title="Lock"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6"/></svg></button>'
      +'<button class="kf-fbtn danger" id="fLogout" title="Log Out"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 6.5a7 7 0 109 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>';
    $('#kfSearch',m).oninput=e=>{ Kickoff.q=e.target.value.trim().toLowerCase(); Kickoff.renderList(); };
    $('#kfSearch',m).onkeydown=e=>{ if(e.key==='Enter'){ const f=$('#kfList .kf-app'); if(f){ closeMenu(); openTool(f.dataset.open); } } };
    $('#fSettings',m).onclick=()=>{ closeMenu(); Settings.open(); };
    $('#fLock',m).onclick=()=>{ closeMenu(); Session.lock(); };
    $('#fLogout',m).onclick=()=>{ closeMenu(); Session.restart(); };
    m.onclick=e=>e.stopPropagation();

  },
  setTab(id){ if(id===this.tab && !this.q) return; this.tab=id; this.q=''; const s=$('#kfSearch'); if(s)s.value='';
    $$('#kfSide .kf-tab').forEach(el=>el.classList.toggle('on', el.dataset.t===id)); this.renderList();
  },
  renderSide(){ const c=$('#kfSide'); if(!c)return;
    c.innerHTML=KFTABS.map(t=>t.sep?'<div class="kf-sep"></div>':'<div class="kf-tab'+(t.id===this.tab?' on':'')+'" data-t="'+esc(t.id)+'"><span class="ti">'+t.icon+'</span>'+esc(t.name)+'</div>').join('');
    $$('#kfSide .kf-tab').forEach(el=>{ const id=el.dataset.t; el.onmouseenter=()=>this.setTab(id); el.onclick=()=>this.setTab(id); });

  renderList(){ const g=$('#kfList'); if(!g)return; let items=[];

    else if(this.tab==='fav') items=KFFAV;

    else items=KFAPPS[this.tab]||[];

    g.innerHTML=items.map(a=>'<div class="kf-app'+((String(a[0]).indexOf('m_')===0||a[0]==='__tutorial')?' mission':'')+'" data-open="'+a[0]+'"><span class="aicon">'+iconFor(a[0])+'</span><span class="aname">'+esc(a[1])+'</span></div>').join('');
    $$('#kfList .kf-app').forEach(el=>el.onclick=()=>{ closeMenu(); openTool(el.dataset.open); });

/* ---- Xfce panel build: quicklaunch, workspaces, cpu graph, tray ---- */
let workspace=1;
function buildWspaces(){ const w=$('#wspaces'); if(!w)return; w.innerHTML=[1,2,3,4].map(n=>'<div class="wsp'+(n===workspace?' on':'')+'" data-w="'+n+'" title="Workspace '+n+'">'+n+'</div>').join('');
  $$('#wspaces .wsp').forEach(el=>el.onclick=()=>{ workspace=+el.dataset.w; $$('#wspaces .wsp').forEach(x=>x.classList.toggle('on',+x.dataset.w===workspace)); }); }
let cpuData=Array.from({length:26},()=>Math.random()*0.25+0.1);
function drawCpu(){ const c=$('#cpugraph'); if(!c||!c.getContext)return; let ctx; try{ ctx=c.getContext('2d'); }catch(e){ return; } if(!ctx)return; const W=c.width,H=c.height;
  cpuData.push(Math.min(1,Math.max(0.05,cpuData[cpuData.length-1]+(Math.random()-0.5)*0.45))); cpuData.shift();
  ctx.clearRect(0,0,W,H);
  ctx.beginPath(); ctx.moveTo(0,H); cpuData.forEach((v,i)=>ctx.lineTo(i/(cpuData.length-1)*W,H-v*H)); ctx.lineTo(W,H); ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(96,165,255,.75)'); g.addColorStop(1,'rgba(96,165,255,.06)'); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); cpuData.forEach((v,i)=>{ const x=i/(cpuData.length-1)*W,y=H-v*H; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.strokeStyle='#8fbcff'; ctx.lineWidth=1.5; ctx.stroke();
}
function buildPanel(){
  const p=$('#pinned'); if(p){ const items=[['__files','File Manager','file-manager'],['__texteditor','Text Editor','text-editor'],['browser','Web Browser','web-browser'],['__terminal','Terminal','terminal'],['root-terminal','Root Terminal','root-terminal']];
    p.innerHTML=items.map(it=>'<button class="pinbtn" title="'+esc(it[1])+'" data-open="'+it[0]+'">'+img(it[2])+'</button>').join('');
    $$('#pinned .pinbtn').forEach(b=>b.onclick=()=>openTool(b.dataset.open)); }
  buildWspaces();
  const tray=$('#systray'); if(tray && !$('#xpChip')){ const xp=document.createElement('span'); xp.className='xp-chip'; xp.id='xpChip'; xp.title='Progress'; xp.onclick=()=>Settings.open();
    const cb=$('#clockbox'); if(cb) tray.insertBefore(xp,cb); else tray.appendChild(xp); }
  if(typeof updateXP!=='undefined')updateXP();
  if(!window._cpuTimer){ window._cpuTimer=setInterval(drawCpu,900); drawCpu(); }
}
function setIface(name){ const n=$('#netIco'); if(n)n.title='Wi-Fi: '+name+(/mon$/.test(name)?' (monitor mode)':' connected'); }
const Session={
  lock(){ const l=$('#lock'); if(!l)return; $('#lockClock').textContent=nowClock(); $('#lockDate').textContent=fullDate(); l.classList.add('on'); },
  unlock(){ const l=$('#lock'); if(l)l.classList.remove('on'); },
  restart(){ const b=$('#boot'); if(b){ b.style.display='flex'; b.classList.remove('gone'); const bar=$('#bootbar'); if(bar)bar.style.width='0%'; boot(); } }
};
function fullDate(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ============================ boot + init ============================ */
const BOOT_LINES=['[ OK ] Started Kali Linux Rolling','[ OK ] Reached target Network','[ OK ] Started OpenSSH server','[ OK ] Loaded aircrack-ng suite','[ OK ] Loaded Metasploit framework','[ OK ] Mounted /usr/share/wordlists','[ OK ] Started Lab Simulator (scripted mode)','<b>Welcome — starting desktop…</b>'];
async function boot(){
  const lines=$('#bootlines'), bar=$('#bootbar');
  for(let i=0;i<BOOT_LINES.length;i++){ lines.innerHTML=BOOT_LINES.slice(Math.max(0,i-3),i+1).map(l=>'<div>'+l+'</div>').join(''); bar.style.width=Math.round((i+1)/BOOT_LINES.length*100)+'%'; await sleep(230); }
  await sleep(350);
  $('#boot').classList.add('gone');
  setTimeout(()=>{ $('#boot').style.display='none'; },600);
}
function tickClock(){ const t=nowClock(); const el=$('#clock'); if(el)el.textContent=t; const cd=$('#clock-date'); if(cd)cd.textContent=fullDate(); const lk=$('#lock'); if(lk&&lk.classList.contains('on')){ const lc=$('#lockClock'); if(lc)lc.textContent=t; const ld=$('#lockDate'); if(ld)ld.textContent=fullDate(); } }
function init(){
  applyAccent(State.accent);
  buildDesktop();
  applyLogos();
  // menu toggle (Kickoff opens upward from the bottom-left)
  $('#menuBtn').onclick=e=>{ e.stopPropagation(); const m=$('#appmenu'); const willOpen=!m.classList.contains('on'); m.classList.toggle('on'); if(willOpen)setTimeout(()=>{const s=$('#kfSearch'); if(s)s.focus();},20); };
  document.addEventListener('click',e=>{ if(!e.target.closest('#appmenu')&&!e.target.closest('#menuBtn')) $('#appmenu').classList.remove('on'); });
  const _ni=$('#netIco'); if(_ni){_ni.style.cursor='pointer';_ni.onclick=()=>Victim.open();}
  // tutorial buttons
  $('#tutNext').onclick=()=>{ if(Tutorial.i>=Tutorial.steps.length-1)Tutorial.end(); else Tutorial.go(Tutorial.i+1); };
  $('#tutBack').onclick=()=>Tutorial.go(Tutorial.i-1);
  $('#tutSkip').onclick=()=>Tutorial.end();
  $('#tutCopy').onclick=()=>{ const c=$('#tutCmd').textContent; try{navigator.clipboard.writeText(c);}catch(e){} toast('Copied: '+c); };
  $('#tutRunFor').onclick=(e)=>{ e.preventDefault(); Tutorial.runFor(); };
  // clock
  tickClock(); setInterval(tickClock,15000);
  // lock screen + panel lock/power buttons
  const _lk=$('#lock'); if(_lk)_lk.onclick=()=>Session.unlock();
  const _lb=$('#lockBtn'); if(_lb)_lb.onclick=()=>Session.lock();
  const _pb=$('#powerBtn'); if(_pb)_pb.onclick=()=>Session.restart();
  // AI prefs
  AI.load();
  // Reveal a clean desktop and OPEN the Applications menu on arrival so the
  // dropdown is immediately visible. It closes on the next outside click.
  setTimeout(()=>{ try{ $('#appmenu').classList.add('on'); }catch(e){} },250);
  setTimeout(()=>toast('👋 This is your Kali desktop. Open the Applications menu (bottom-left) or double-click a mission on the desktop.'),1500);
  window.addEventListener('resize',()=>{ if($('#tut-overlay').classList.contains('on'))Tutorial.position(Tutorial.steps[Tutorial.i]); });
}
function forceRevealDesktop(){ const b=document.getElementById('boot'); if(b){ b.classList.add('gone'); setTimeout(function(){ b.style.display='none'; },600); } }
(function(){
  try{ applyLogos(); }catch(e){}
  try{ buildWallpaper(); }catch(e){}
  // Hard failsafe: no matter what happens below, reveal the desktop within 3.2s.
  setTimeout(forceRevealDesktop,3200);
  (async function(){
    try{ await boot(); }
    catch(e){ console.error('boot failed:',e); forceRevealDesktop(); }
    try{ init(); }
    catch(e){ console.error('init failed:',e); forceRevealDesktop(); try{ toast('Some features failed to load, but the desktop is ready.'); }catch(_){}
      // Minimum viable desktop: make sure the Applications menu still works.
      try{ const mb=document.getElementById('menuBtn'), am=document.getElementById('appmenu'); if(mb&&am){ mb.onclick=function(ev){ev.stopPropagation();am.classList.toggle('on');}; } }catch(_){}
    }
  })();
})();
